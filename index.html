<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Alphabet Dating — Memory Keyboard</title>
  <style>
    :root {
      --bg: #050508;
      --kb-bg: #030304;
      --kb-frame: #ffffff;
      --key-outer: #d4d4d8;
      --key-inner: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 50% 22%, rgba(255, 255, 255, 0.08) 0%, transparent 55%),
        radial-gradient(circle at 50% 0%, #171721 0%, var(--bg) 75%);
      color: #ffffff;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 14px 10px 18px;
      overflow: hidden;
    }

    /* =====================================================================
       STAGE AREA: 3D INTRO TILES, SINGLE LOWER-THIRD, & 3D ESC COVERFLOW
       ===================================================================== */
    .stage-area {
      width: 100%;
      max-width: 1180px;
      min-height: 240px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      perspective: 1200px;
      margin-bottom: 8px;
    }

    /* 1. 3D Intro Word Tiles */
    .intro-word-banner {
      display: none;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 2vw, 14px);
      min-height: 80px;
      perspective: 900px;
      transform-style: preserve-3d;
    }

    .intro-word-banner.active {
      display: flex;
    }

    .intro-letter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: clamp(42px, 8vw, 62px);
      height: clamp(50px, 9.5vw, 72px);
      padding: 0 12px;
      border-radius: 14px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.05));
      border: 2px solid #ffffff;
      font-size: clamp(1.5rem, 3.8vw, 2.4rem);
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 18px #ffffff;
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.75),
        0 0 24px rgba(255, 255, 255, 0.55),
        inset 0 0 14px rgba(255, 255, 255, 0.45);
      transform-origin: center bottom;
      animation: tile3DIn 0.42s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .intro-word-banner.word-complete .intro-letter {
      animation: wordCompletePulse 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .intro-word-banner.word-exit .intro-letter {
      animation: wordSweepOut 0.26s ease-in forwards;
    }

    @keyframes tile3DIn {
      0% {
        opacity: 0;
        transform: translateY(36px) rotateX(-70deg) scale(0.5);
        filter: blur(6px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) rotateX(0deg) scale(1);
        filter: blur(0);
      }
    }

    @keyframes wordCompletePulse {
      0%   { transform: translateY(0) scale(1); }
      45%  { transform: translateY(-8px) scale(1.1); box-shadow: 0 0 38px #ffffff, inset 0 0 20px #ffffff; }
      100% { transform: translateY(0) scale(1); }
    }

    @keyframes wordSweepOut {
      to {
        opacity: 0;
        transform: translateY(-22px) scale(0.85);
        filter: blur(4px);
      }
    }

    /* 2. Single Key Lower-Third Box with 3D Spring Entrance & Glass Shine */
    .lowerthird-box {
      position: relative;
      display: none;
      align-items: stretch;
      background: #0b0b0e;
      border: 2px solid #ffffff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.92),
        0 0 30px rgba(255, 255, 255, 0.28);
      max-width: 490px;
      width: 100%;
      height: 210px;
      cursor: pointer;
      transform-style: preserve-3d;
    }

    .lowerthird-box.visible {
      display: flex;
      animation: cardSpringIn 0.48s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .lowerthird-box::after {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 70%;
      height: 100%;
      background: linear-gradient(
        105deg,
        transparent 20%,
        rgba(255, 255, 255, 0.22) 50%,
        transparent 80%
      );
      pointer-events: none;
      z-index: 6;
    }

    .lowerthird-box.shine::after {
      animation: glassSweep 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes glassSweep {
      from { left: -80%; }
      to   { left: 140%; }
    }

    @keyframes cardSpringIn {
      0% {
        opacity: 0;
        transform: translateY(28px) rotateX(-22deg) scale(0.88);
      }
      100% {
        opacity: 1;
        transform: translateY(0) rotateX(0deg) scale(1);
      }
    }

    .lt-photo-wrap {
      position: relative;
      width: 170px;
      height: 100%;
      background: #050505;
      flex-shrink: 0;
      overflow: hidden;
      border-right: 1.5px solid rgba(255, 255, 255, 0.35);
    }

    .lt-slider-track {
      display: flex;
      width: 100%;
      height: 100%;
      will-change: transform;
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .lt-slide {
      min-width: 100%;
      width: 100%;
      height: 100%;
      flex-shrink: 0;
      overflow: hidden;
    }

    .lt-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scale(1.06);
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1), filter 0.55s ease;
    }

    .lt-slide.active-slide img {
      transform: scale(1);
    }

    .lt-slide-dots {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      gap: 5px;
      background: rgba(0, 0, 0, 0.65);
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      z-index: 4;
    }

    .lt-slide-dots.show {
      display: flex;
    }

    .lt-slide-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      transition: background 0.25s ease, transform 0.25s ease;
    }

    .lt-slide-dots span.active-dot {
      background: #ffffff;
      transform: scale(1.25);
    }

    .lt-info {
      flex: 1;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(135deg, #15151b 0%, #070709 100%);
      min-width: 0;
    }

    .lt-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .lt-key-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 34px;
      height: 34px;
      padding: 0 10px;
      border-radius: 9px;
      background: #ffffff;
      color: #000000;
      font-weight: 800;
      font-size: 0.92rem;
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.75);
    }

    .lt-text-group {
      margin-top: auto;
    }

    .lt-title {
      font-size: 1.12rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }

    .lt-sub {
      font-size: 0.82rem;
      color: #d4d4d8;
      line-height: 1.42;
    }

    /* =====================================================================
       3. 3D COVERFLOW CARD CASCADE FOR ESC A-TO-Z REEL
       ===================================================================== */
    .reel-deck {
      position: relative;
      display: none;
      width: 100%;
      max-width: 900px;
      height: 220px;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      perspective: 1200px;
    }

    .reel-deck.active {
      display: flex;
    }

    .reel-card {
      position: absolute;
      width: min(88vw, 460px);
      height: 204px;
      display: flex;
      align-items: stretch;
      background: #0b0b0e;
      border: 2px solid #ffffff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 28px rgba(255, 255, 255, 0.25);
      will-change: transform, opacity, filter;
      transition:
        transform 0.56s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1),
        filter 0.5s ease,
        box-shadow 0.5s ease;
      pointer-events: none;
    }

    .reel-card .lt-photo-wrap {
      width: 162px;
    }

    /* 3D Coverflow Positions */
    .reel-card[data-pos="0"] {
      transform: translate3d(0%, 0px, 0px) rotateY(0deg) scale(1);
      opacity: 1;
      filter: brightness(1);
      z-index: 10;
      box-shadow: 0 22px 55px rgba(0, 0, 0, 0.95), 0 0 36px rgba(255, 255, 255, 0.45);
    }

    .reel-card[data-pos="1"] {
      transform: translate3d(54%, -4px, -140px) rotateY(-28deg) scale(0.84);
      opacity: 0.52;
      filter: brightness(0.65) blur(1px);
      z-index: 7;
    }

    .reel-card[data-pos="2"] {
      transform: translate3d(88%, -10px, -260px) rotateY(-40deg) scale(0.68);
      opacity: 0.2;
      filter: brightness(0.45) blur(2px);
      z-index: 4;
    }

    .reel-card[data-pos="-1"] {
      transform: translate3d(-54%, -4px, -140px) rotateY(28deg) scale(0.84);
      opacity: 0.52;
      filter: brightness(0.65) blur(1px);
      z-index: 7;
    }

    .reel-card[data-pos="-2"] {
      transform: translate3d(-88%, -10px, -260px) rotateY(40deg) scale(0.68);
      opacity: 0.2;
      filter: brightness(0.45) blur(2px);
      z-index: 4;
    }

    .reel-card[data-pos="far-right"] {
      transform: translate3d(115%, -16px, -360px) rotateY(-48deg) scale(0.55);
      opacity: 0;
      z-index: 1;
    }

    .reel-card[data-pos="far-left"] {
      transform: translate3d(-115%, -16px, -360px) rotateY(48deg) scale(0.55);
      opacity: 0;
      z-index: 1;
    }

    /* =====================================================================
       BRIGHTER BLACK & WHITE AZERTY KEYBOARD + SHOCKWAVE RIPPLE
       ===================================================================== */
    .kb-outer {
      width: 100%;
      max-width: 1220px;
      display: flex;
      justify-content: center;
    }

    .keyboard-chassis {
      width: 100%;
      background: var(--kb-bg);
      border: 3px solid var(--kb-frame);
      border-radius: clamp(16px, 2.2vw, 28px);
      padding: clamp(8px, 1.6vw, 20px);
      display: flex;
      gap: clamp(6px, 1.4vw, 18px);
      box-shadow:
        0 0 30px rgba(255, 255, 255, 0.12),
        0 20px 60px rgba(0, 0, 0, 0.95);
    }

    .kb-main {
      flex: 14.5;
      display: flex;
      flex-direction: column;
      gap: clamp(4px, 0.55vw, 7px);
      min-width: 0;
    }

    .kb-numpad {
      flex: 4;
      display: flex;
      flex-direction: column;
      gap: clamp(4px, 0.55vw, 7px);
      min-width: 0;
    }

    .kb-row {
      display: flex;
      gap: clamp(4px, 0.55vw, 7px);
      width: 100%;
      align-items: stretch;
    }

    .mobile-only {
      display: none !important;
    }

    .keycap {
      position: relative;
      flex: 1;
      aspect-ratio: 1 / 1;
      background: #0a0a0d;
      border: 1.6px solid var(--key-outer);
      border-radius: clamp(6px, 0.9vw, 11px);
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(0.58rem, 1.12vw, 0.98rem);
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(255, 255, 255, 0.06);
      transition:
        opacity 0.25s ease,
        transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
        background 0.22s ease,
        box-shadow 0.22s ease,
        border-color 0.22s ease;
      min-width: 0;
      padding: 0;
    }

    .keycap::after {
      content: "";
      position: absolute;
      inset: clamp(1.5px, 0.2vw, 2.5px);
      border: 1.4px solid var(--key-inner);
      border-radius: clamp(4px, 0.7vw, 8px);
      pointer-events: none;
    }

    .keycap.pulse-wave::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      border: 2px solid #ffffff;
      box-shadow: 0 0 18px #ffffff;
      pointer-events: none;
      animation: keyShockwave 0.58s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes keyShockwave {
      0%   { opacity: 0.95; transform: scale(0.95); }
      100% { opacity: 0; transform: scale(1.48); }
    }

    .keycap:hover {
      background: #18181f;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.25);
    }

    .keycap.pill {
      aspect-ratio: 2.1 / 1;
      border-radius: 999px;
      font-size: clamp(0.42rem, 0.75vw, 0.68rem);
    }

    .keycap.pill::after {
      border-radius: 999px;
    }

    .keycap.w-half  { flex: 0.58; aspect-ratio: auto; }
    .keycap.w-tab   { flex: 1.48; aspect-ratio: auto; }
    .keycap.w-caps  { flex: 1.82; aspect-ratio: auto; }
    .keycap.w-shift { flex: 2.25; aspect-ratio: auto; }
    .keycap.w-ctrl  { flex: 0.9;  aspect-ratio: auto; }
    .keycap.w-space { flex: 5.2;  aspect-ratio: auto; }
    .keycap.w-fill  { flex: 1.5;  aspect-ratio: auto; }

    /* =====================================================================
       SUBTLE DIMMING + STRONG NEON GLOW ON PRESSED OR INTRO-LIT KEY
       ===================================================================== */
    .keyboard-chassis.dim-mode .keycap:not(.active-key) {
      opacity: 0.52;
    }

    .keycap.active-key,
    .keycap.intro-lit {
      opacity: 1 !important;
      background: rgba(255, 255, 255, 0.36);
      border-color: #ffffff;
      box-shadow:
        0 0 26px #ffffff,
        0 0 12px rgba(255, 255, 255, 0.95),
        inset 0 0 14px rgba(255, 255, 255, 0.9);
      transform: translateY(-2px) scale(1.04);
      z-index: 3;
    }

    .keycap.active-key::after,
    .keycap.intro-lit::after {
      border-color: #ffffff;
      box-shadow: inset 0 0 10px #ffffff;
    }

    .multi-dots {
      position: absolute;
      bottom: 11%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 2.5px;
    }

    .multi-dots span {
      width: 3.5px;
      height: 3.5px;
      border-radius: 50%;
      background: #ffffff;
    }

    .lbl-tl { position: absolute; top: 12%; left: 14%; font-size: 0.68em; line-height: 1; }
    .lbl-tr { position: absolute; top: 12%; right: 14%; font-size: 0.68em; line-height: 1; }
    .lbl-bl { position: absolute; bottom: 12%; left: 14%; font-size: 0.68em; line-height: 1; }
    .lbl-br { position: absolute; bottom: 12%; right: 14%; font-size: 0.68em; line-height: 1; }
    .lbl-c  { font-size: 1em; font-weight: 600; }
    .lbl-sm { font-size: 0.72em; }

    .numpad-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: clamp(4px, 0.55vw, 7px);
    }

    .numpad-grid .keycap {
      aspect-ratio: auto;
      width: 100%;
      height: 100%;
    }

    .split-arrows {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .split-arrows .keycap {
      aspect-ratio: auto;
      flex: 1;
      border-radius: 4px;
      font-size: 0.65em;
    }

    /* =====================================================================
       CLEAN MOBILE AZERTY KEYBOARD
       ===================================================================== */
    @media (max-width: 768px) {
      .stage-area {
        min-height: 195px;
      }

      .lowerthird-box {
        height: 174px;
        max-width: 96vw;
      }

      .lt-photo-wrap,
      .reel-card .lt-photo-wrap {
        width: 132px;
      }

      .reel-deck {
        height: 184px;
      }

      .reel-card {
        width: 90vw;
        height: 172px;
      }

      .lt-title {
        font-size: 1rem;
      }

      .lt-sub {
        font-size: 0.75rem;
      }

      .keyboard-chassis {
        padding: 10px 8px;
        border-radius: 22px;
        border-width: 2.5px;
      }

      .kb-main {
        gap: 6px;
      }

      .kb-row {
        gap: 4.5px;
      }

      .kb-numpad,
      .hide-mobile {
        display: none !important;
      }

      .mobile-only {
        display: flex !important;
      }

      .keycap {
        aspect-ratio: auto;
        height: 46px;
        font-size: 0.92rem;
        border-radius: 8px;
        border-width: 1.2px;
      }

      .keycap::after {
        inset: 1.5px;
        border-width: 1.1px;
        border-radius: 6px;
      }

      .lbl-tl {
        top: 4px;
        left: 4px;
        font-size: 0.54em;
        opacity: 0.88;
      }

      .lbl-br {
        bottom: 4px;
        right: 4px;
        font-size: 0.54em;
        opacity: 0.88;
      }

      .keycap.has-dots .lbl-c {
        transform: translateY(-2px);
      }

      .multi-dots {
        bottom: 5px;
        gap: 2px;
      }

      .multi-dots span {
        width: 3px;
        height: 3px;
      }
    }
  </style>
</head>
<body>

  <!-- Stage: 3D Intro Tiles, Single Lower-Third Box, and 3D ESC Coverflow Deck -->
  <div class="stage-area">
    <div class="intro-word-banner" id="introWordBanner"></div>

    <div class="lowerthird-box" id="lowerthirdBox">
      <div class="lt-photo-wrap">
        <div class="lt-slider-track" id="ltSliderTrack"></div>
        <div class="lt-slide-dots" id="ltSlideDots"></div>
      </div>
      <div class="lt-info">
        <div class="lt-top-row">
          <span class="lt-key-pill" id="ltKeyPill">A</span>
        </div>
        <div class="lt-text-group" id="ltTextGroup">
          <div class="lt-title" id="ltTitle">Anniversary</div>
          <div class="lt-sub" id="ltSub">Celebrating us and every milestone with my sayang.</div>
        </div>
      </div>
    </div>

    <!-- 3D Coverflow Deck for ESC Alphabetical Showcase -->
    <div class="reel-deck" id="reelDeck"></div>
  </div>

  <!-- Belgian AZERTY Keyboard -->
  <div class="kb-outer">
    <div class="keyboard-chassis" id="kbChassis">

      <div class="kb-main">
        <!-- Row 1: Desktop Function Pill Keys -->
        <div class="kb-row hide-mobile">
          <button type="button" class="keycap pill" data-esc="true"><span class="lbl-sm">esc</span></button>
          <button type="button" class="keycap pill"><span class="lbl-tl">1</span><span class="lbl-br">f1</span></button>
          <button type="button" class="keycap pill"><span class="lbl-tl">☼-</span><span class="lbl-br">f2</span></button>
          <button type="button" class="keycap pill"><span class="lbl-tl">☼+</span><span class="lbl-br">f3</span></button>
          <button type="button" class="keycap pill"><span class="lbl-tl">▭</span><span class="lbl-br">f4</span></button>
          <button type="button" class="keycap pill"><span class="lbl-tl">⊞</span><span class="lbl-br">f5</span></button>
          <button type="button" class="keycap pill"><span class="lbl-tl">🔇</span><span class="lbl-br">f6</span></button>
          <button type="button" class="keycap pill"><span class="lbl-tl">🔉</span><span class="lbl-br">f7</span></button>
          <button type="button" class="keycap pill"><span class="lbl-tl">🔊</span><span class="lbl-br">f8</span></button>
          <button type="button" class="keycap pill"><span class="lbl-tl">|◀◀</span><span class="lbl-br">f9</span></button>
          <button type="button" class="keycap pill"><span class="lbl-tl">▶|</span><span class="lbl-br">f10</span></button>
          <button type="button" class="keycap pill"><span class="lbl-tl">▶▶|</span><span class="lbl-br">f11</span></button>
          <button type="button" class="keycap pill"><span class="lbl-tl">✈</span><span class="lbl-br">f12</span></button>
          <button type="button" class="keycap pill"><span class="lbl-sm">prt scr</span></button>
          <button type="button" class="keycap pill" data-clear="true"><span class="lbl-sm">delete</span></button>
        </div>

        <!-- Row 2: Number Row (1 through 0) -->
        <div class="kb-row">
          <button type="button" class="keycap w-half hide-mobile"><span class="lbl-tl">³</span><span class="lbl-bl">²</span></button>
          <button type="button" class="keycap"><span class="lbl-tl">1</span><span class="lbl-c">&amp;</span><span class="lbl-br">|</span></button>
          <button type="button" class="keycap" data-key="@"><span class="lbl-tl">2</span><span class="lbl-c">é</span><span class="lbl-br">@</span></button>
          <button type="button" class="keycap"><span class="lbl-tl">3</span><span class="lbl-c">"</span><span class="lbl-br">#</span></button>
          <button type="button" class="keycap"><span class="lbl-tl">4</span><span class="lbl-c">'</span></button>
          <button type="button" class="keycap"><span class="lbl-tl">5</span><span class="lbl-c">(</span></button>
          <button type="button" class="keycap"><span class="lbl-tl">6</span><span class="lbl-c">§</span><span class="lbl-br">^</span></button>
          <button type="button" class="keycap"><span class="lbl-tl">7</span><span class="lbl-c">è</span></button>

  <script>
    // =========================================================================
    // 1. MEMORIES DATA
    // =========================================================================
    const KEY_MEMORIES = {
      "A": { title: "Anniversary", sub: "Celebrating us and every milestone with my sayang.", files: ["anniversary celebrating.jpeg"] },
      "@": { title: "Always & Forever", sub: "Celebrating us and every milestone with my sayang.", files: ["anniversary celebrating.jpeg"] },
      "B": { title: "Birthday Celebration", sub: "Candlelight, cake, and making a wish together.", files: ["birthdaycelebration.jpeg"] },

      "N": { title: "New Year's Eve", sub: "Riding in the new year together", files: ["newyearcelebrations.jpeg"] },
      "O": { title: "Island Hopping", sub: "Exploring Bintan and it's peaceful beauty", files: ["oceanview.jpeg"] },
      "P": { title: "Photobooth", sub: "Capturing our memories with extra attributes.", files: ["photobooth.jpeg", "photobooth2.jpeg"] },
      "Q": { title: "Quality Time", sub: "No rush, no distractions — just us.", files: ["qualitytime.jpeg", "qualitytime2.jpeg"] },
      "R": { title: "Reading Together", sub: "Quiet bookstore moments, was fun.", files: ["read.jpeg"] },
      "S": { title: "Singapore", sub: "Welcome to Singapore, we aren't singa yet", files: ["singapore.jpeg", "singapore2.jpeg"] },
      "T": { title: "Prambanan, Jogja", sub: "Temple run through Prambanan temples", files: ["templerun.jpeg"] },
      "U": { title: "Universal Studios", sub: "Pure, endless joy from start to finish.", files: ["universalstudios.jpeg"] },
      "V": { title: "Kawah Ijen", sub: "We reached the top and had a breathtaking view, thank you sayang!", files: ["volcano.jpeg"] },
      "W": { title: "Waterpark", sub: "It was fun, chaotic, and something totally different.", files: ["waterpark.jpeg"] },
      "X": { title: "X-plore", sub: "Because each time we meet, we need to catch up and make new memories.", files: ["explore.jpeg"] },
      "Y": { title: "Yapping", sub: "Endless talks together.", files: ["yapping.jpeg"] },
      "Z": { title: "Zen", sub: "Peace is just being right there with you, sayang.", files: ["zen.jpeg"] }
    };

    function createImageWithFallback(filename, altText) {
      const img = document.createElement("img");
      img.alt = altText;
      const encoded = encodeURIComponent(filename);
      const paths = [encoded, `memories/${encoded}`, `public/memories/${encoded}`];
      let tryIdx = 0;
      img.onerror = () => {
        tryIdx++;
        if (tryIdx < paths.length) img.src = paths[tryIdx];
      };
      img.src = paths[0];
      return img;
    }

    function preloadAllImages() {
      const seen = new Set();
      Object.values(KEY_MEMORIES).forEach((entry) => {
        entry.files.forEach((file) => {
          if (seen.has(file)) return;
          seen.add(file);
          createImageWithFallback(file, "");
        });
      });
    }

    // =========================================================================
    // 2. 3D INTRO ANIMATION & 3D COVERFLOW ESCAPE REEL
    // =========================================================================
    const INTRO_WORDS  = ["AULI@", "I", "LOVE", "YOU", "CUZ", "YOU", "ARE", "SPECIAL"];
    const LETTER_DELAY = 340;
    const WORD_HOLD    = 820;
    const REEL_STEP_MS = 640; // Time per step in the 3D Coverflow reel

    let introTimers = [];
    let flashTimers = [];
    let isReelPlaying = false;
    let currentKey = null;
    let currentSlideIdx = 0;
    let autoSwipeTimer = null;

    const chassis = document.getElementById("kbChassis");
    const lowerthirdBox = document.getElementById("lowerthirdBox");
    const introBanner = document.getElementById("introWordBanner");
    const sliderTrack = document.getElementById("ltSliderTrack");
    const slideDots = document.getElementById("ltSlideDots");
    const keyPill = document.getElementById("ltKeyPill");
    const reelDeck = document.getElementById("reelDeck");

    function triggerKeyShockwave(k) {
      document.querySelectorAll(`.keycap[data-key="${k}"]`).forEach((btn) => {
        btn.classList.remove("pulse-wave");
        void btn.offsetWidth;
        btn.classList.add("pulse-wave");
      });
    }

    function highlightMatchingKeys(k) {
      document.querySelectorAll(".keycap.active-key").forEach((el) => el.classList.remove("active-key"));
      document.querySelectorAll(`.keycap[data-key="${k}"]`).forEach((el) => el.classList.add("active-key"));
      triggerKeyShockwave(k);
    }

    function stopIntroAnimation() {
      introTimers.forEach(clearTimeout);
      introTimers = [];
      document.querySelectorAll(".keycap.intro-lit").forEach((el) => el.classList.remove("intro-lit"));
      introBanner.classList.remove("active", "word-complete", "word-exit");
      introBanner.innerHTML = "";
    }

    function stopAlphabetFlash() {
      flashTimers.forEach(clearTimeout);
      flashTimers = [];
      isReelPlaying = false;
      reelDeck.classList.remove("active");
      reelDeck.innerHTML = "";
    }

    function playIntroSequence() {
      stopAlphabetFlash();
      stopIntroAnimation();
      clearSelection();

      introBanner.classList.add("active");
      let elapsed = 220;

      INTRO_WORDS.forEach((word) => {
        const startWordTimer = setTimeout(() => {
          document.querySelectorAll(".keycap.intro-lit").forEach((el) => el.classList.remove("intro-lit"));
          introBanner.classList.remove("word-complete", "word-exit");
          introBanner.innerHTML = "";
        }, elapsed);
        introTimers.push(startWordTimer);

        word.split("").forEach((ch) => {
          elapsed += LETTER_DELAY;
          const letterTimer = setTimeout(() => {
            document.querySelectorAll(`.keycap[data-key="${ch}"]`).forEach((btn) => {
              btn.classList.add("intro-lit");
            });
            triggerKeyShockwave(ch);

            const span = document.createElement("span");
            span.className = "intro-letter";
            span.textContent = ch === "@" ? "A" : ch;
            introBanner.appendChild(span);
          }, elapsed);
          introTimers.push(letterTimer);
        });

        const pulseTimer = setTimeout(() => {
          introBanner.classList.add("word-complete");
        }, elapsed + 160);
        introTimers.push(pulseTimer);

        const exitTimer = setTimeout(() => {
          introBanner.classList.remove("word-complete");
          introBanner.classList.add("word-exit");
        }, elapsed + WORD_HOLD - 220);
        introTimers.push(exitTimer);

        elapsed += WORD_HOLD;
      });

      const endTimer = setTimeout(() => {
        stopIntroAnimation();
      }, elapsed + 150);
      introTimers.push(endTimer);
    }

    // 3D Coverflow Card Stream for ESC (1 Card per Letter; Double-Photo Cards Swipe Internally!)
    function playAlphabetFlash() {
      if (isReelPlaying) {
        stopAlphabetFlash();
        clearSelection();
        return;
      }

      stopIntroAnimation();
      stopAlphabetFlash();
      clearInterval(autoSwipeTimer);
      lowerthirdBox.classList.remove("visible");
      isReelPlaying = true;

      const alphabetKeys = Object.keys(KEY_MEMORIES)
        .filter((k) => /^[A-Z]$/.test(k))
        .sort();

      reelDeck.innerHTML = "";
      reelDeck.classList.add("active");

      // Create exactly ONE 3D card per letter (A-Z) with an internal slider track
      const cardObjs = alphabetKeys.map((k, idx) => {
        const entry = KEY_MEMORIES[k];
        const card = document.createElement("div");
        card.className = "reel-card";
        card.dataset.pos = idx === 0 ? "0" : idx === 1 ? "1" : idx === 2 ? "2" : "far-right";

        const photoWrap = document.createElement("div");
        photoWrap.className = "lt-photo-wrap";

        const track = document.createElement("div");
        track.className = "lt-slider-track";

        entry.files.forEach((file, fIdx) => {
          const slide = document.createElement("div");
          slide.className = "lt-slide" + (fIdx === 0 ? " active-slide" : "");
          slide.appendChild(createImageWithFallback(file, entry.title));
          track.appendChild(slide);
        });
        photoWrap.appendChild(track);

        let dotsWrap = null;
        if (entry.files.length > 1) {
          dotsWrap = document.createElement("div");
          dotsWrap.className = "lt-slide-dots show";
          entry.files.forEach((_, dIdx) => {
            const dot = document.createElement("span");
            if (dIdx === 0) dot.classList.add("active-dot");
            dotsWrap.appendChild(dot);
          });
          photoWrap.appendChild(dotsWrap);
        }

        const info = document.createElement("div");
        info.className = "lt-info";
        info.innerHTML = `
          <div class="lt-top-row">
            <span class="lt-key-pill">${k}</span>
          </div>
          <div class="lt-text-group">
            <div class="lt-title">${entry.title}</div>
            <div class="lt-sub">${entry.sub}</div>
          </div>
        `;

        card.appendChild(photoWrap);
        card.appendChild(info);
        reelDeck.appendChild(card);

        return { k, entry, card, track, dotsWrap };
      });

      let elapsed = 0;

      cardObjs.forEach((item, activeIdx) => {
        // 1. Bring this letter's card to the front of the 3D Coverflow
        const cardArrivalTimer = setTimeout(() => {
          chassis.classList.add("dim-mode");
          highlightMatchingKeys(item.k);

          cardObjs.forEach((other, cIdx) => {
            const diff = cIdx - activeIdx;
            if (diff === 0) other.card.dataset.pos = "0";
            else if (diff === 1) other.card.dataset.pos = "1";
            else if (diff === 2) other.card.dataset.pos = "2";
            else if (diff === -1) other.card.dataset.pos = "-1";
            else if (diff === -2) other.card.dataset.pos = "-2";
            else if (diff > 2) other.card.dataset.pos = "far-right";
            else other.card.dataset.pos = "far-left";
          });
        }, elapsed);
        flashTimers.push(cardArrivalTimer);

        // 2. If this letter has 2+ photos, swipe the photo inside the centered card before moving on
        if (item.entry.files.length > 1) {
          for (let fIdx = 1; fIdx < item.entry.files.length; fIdx++) {
            elapsed += REEL_STEP_MS;
            const swipeTimer = setTimeout(() => {
              item.track.style.transform = `translateX(-${fIdx * 100}%)`;
              const slides = item.track.querySelectorAll(".lt-slide");
              slides.forEach((s, sIdx) => s.classList.toggle("active-slide", sIdx === fIdx));
              if (item.dotsWrap) {
                const dots = item.dotsWrap.querySelectorAll("span");
                dots.forEach((d, dIdx) => d.classList.toggle("active-dot", dIdx === fIdx));
              }
            }, elapsed);
            flashTimers.push(swipeTimer);
          }
        }

        elapsed += REEL_STEP_MS;
      });

      // Settle on the final 'Z' card when the 3D cascade finishes
      const finishTimer = setTimeout(() => {
        stopAlphabetFlash();
        selectKey("Z");
      }, elapsed + 350);
      flashTimers.push(finishTimer);
    }

    document.querySelectorAll("[data-esc]").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        playAlphabetFlash();
      });
    });

    // =========================================================================
    // 3. SINGLE KEY SELECTION & AUTO-SWIPE CAROUSEL
    // =========================================================================
    document.querySelectorAll(".keycap[data-key]").forEach((btn) => {
      const k = btn.dataset.key;
      const entry = KEY_MEMORIES[k];
      if (entry && entry.files && entry.files.length > 1) {
        btn.classList.add("has-dots");
        const dots = document.createElement("div");
        dots.className = "multi-dots";
        dots.innerHTML = "<span></span>".repeat(entry.files.length);
        btn.appendChild(dots);
      }
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        selectKey(k);
      });
    });

    document.querySelectorAll("[data-clear]").forEach((btn) => {
      btn.addEventListener("click", () => {
        stopAlphabetFlash();
        clearSelection();
      });
    });

    document.querySelectorAll("[data-cycle]").forEach((btn) => {
      btn.addEventListener("click", () => stepSlide(parseInt(btn.dataset.cycle, 10)));
    });

    function selectKey(k) {
      const entry = KEY_MEMORIES[k];
      if (!entry) return;

      const wasReel = isReelPlaying;
      stopIntroAnimation();
      stopAlphabetFlash();

      if (!wasReel && currentKey === k && entry.files.length > 1) {
        stepSlide(1);
        return;
      }

      currentKey = k;
      currentSlideIdx = 0;

      chassis.classList.add("dim-mode");
      highlightMatchingKeys(k);

      renderLowerThird(k, entry, true);
    }

    function renderLowerThird(k, entry, enableAutoSwipe = true) {
      clearInterval(autoSwipeTimer);

      lowerthirdBox.classList.remove("visible", "shine");
      void lowerthirdBox.offsetWidth;
      lowerthirdBox.classList.add("visible", "shine");

      sliderTrack.style.transition = "none";
      sliderTrack.innerHTML = "";
      sliderTrack.style.transform = "translateX(0%)";

      entry.files.forEach((file, idx) => {
        const slide = document.createElement("div");
        slide.className = "lt-slide" + (idx === 0 ? " active-slide" : "");
        slide.appendChild(createImageWithFallback(file, entry.title));
        sliderTrack.appendChild(slide);
      });

      void sliderTrack.offsetWidth;
      sliderTrack.style.transition = "transform 0.55s cubic-bezier(0.22, 1, 0.36, 1)";

      slideDots.innerHTML = "";
      if (entry.files.length > 1) {
        slideDots.classList.add("show");
        entry.files.forEach((_, idx) => {
          const dot = document.createElement("span");
          if (idx === 0) dot.classList.add("active-dot");
          slideDots.appendChild(dot);
        });

        if (enableAutoSwipe) {
          autoSwipeTimer = setInterval(() => {
            stepSlide(1, false);
          }, 2600);
        }
      } else {
        slideDots.classList.remove("show");
      }

      keyPill.textContent = k === "@" ? "2 é @" : k;
      document.getElementById("ltTitle").textContent = entry.title;
      document.getElementById("ltSub").textContent = entry.sub;
    }

    function stepSlide(dir, resetTimer = true) {
      if (!currentKey || !KEY_MEMORIES[currentKey] || isReelPlaying) return;
      const files = KEY_MEMORIES[currentKey].files;
      if (!files || files.length <= 1) return;

      currentSlideIdx = (currentSlideIdx + dir + files.length) % files.length;
      sliderTrack.style.transform = `translateX(-${currentSlideIdx * 100}%)`;

      const slides = sliderTrack.querySelectorAll(".lt-slide");
      slides.forEach((s, idx) => s.classList.toggle("active-slide", idx === currentSlideIdx));

      const dots = slideDots.querySelectorAll("span");
      dots.forEach((d, idx) => d.classList.toggle("active-dot", idx === currentSlideIdx));

      if (resetTimer) {
        clearInterval(autoSwipeTimer);
        autoSwipeTimer = setInterval(() => stepSlide(1, false), 2600);
      }
    }

    function clearSelection() {
      clearInterval(autoSwipeTimer);
      currentKey = null;
      chassis.classList.remove("dim-mode");
      document.querySelectorAll(".keycap.active-key").forEach((el) => el.classList.remove("active-key"));
      lowerthirdBox.classList.remove("visible", "shine");
    }

    lowerthirdBox.addEventListener("click", () => stepSlide(1, true));

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        playAlphabetFlash();
      } else if (e.key === "ArrowRight" || e.key === "ArrowDown") {
        stepSlide(1, true);
      } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
        stepSlide(-1, true);
      } else if (e.key === "@" || e.key === "2" || e.key === "é") {
        selectKey("@");
      } else if (/^[a-zA-Z]$/.test(e.key)) {
        selectKey(e.key.toUpperCase());
      }
    });

    // =========================================================================
    // 4. DOUBLE-TAP / DOUBLE-CLICK OUTSIDE KEYBOARD FOR FULLSCREEN
    // =========================================================================
    function toggleFullscreen() {
      const doc = document;
      const elem = doc.documentElement;
      if (!doc.fullscreenElement && !doc.webkitFullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen().catch(() => {});
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        }
      } else {
        if (doc.exitFullscreen) {
          doc.exitFullscreen().catch(() => {});
        } else if (doc.webkitExitFullscreen) {
          doc.webkitExitFullscreen();
        }
      }
    }

    let lastOutsideTap = 0;
    document.addEventListener("pointerup", (e) => {
      if (
        e.target.closest("#kbChassis") ||
        e.target.closest("#lowerthirdBox") ||
        e.target.closest("#reelDeck")
      ) {
        return;
      }
      const now = Date.now();
      if (now - lastOutsideTap < 320) {
        toggleFullscreen();
        lastOutsideTap = 0;
      } else {
        lastOutsideTap = now;
      }
    });

    window.addEventListener("DOMContentLoaded", () => {
      preloadAllImages();
      playIntroSequence();
    });
  </script>
</body>
</html>
