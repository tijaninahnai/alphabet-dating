<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Alphabet Dating — Memory Keyboard</title>
  <style>
    :root {
      --bg: #050507;
      --kb-bg: #020203;
      --kb-frame: #ffffff;
      --key-outer: #d4d4d8;
      --key-inner: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(circle at 50% 18%, #141418 0%, var(--bg) 75%);
      color: #ffffff;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 14px 10px 18px;
      overflow: hidden;
    }

    /* =====================================================================
       CLEAN STAGE AREA: MINIMAL INTRO TEXT & SINGLE LOWER-THIRD CARD
       ===================================================================== */
    .stage-area {
      width: 100%;
      max-width: 1180px;
      min-height: 230px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 8px;
    }

    .intro-word-banner {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 64px;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 800;
      letter-spacing: 0.24em;
    }

    .intro-word-banner.active {
      display: flex;
    }

    .intro-letter {
      display: inline-block;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.9);
      animation: letterFadeIn 0.24s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes letterFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Compact Lower-Third Card */
    .lowerthird-box {
      position: relative;
      display: none;
      align-items: stretch;
      background: #0a0a0d;
      border: 2px solid #ffffff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.92),
        0 0 24px rgba(255, 255, 255, 0.18);
      max-width: 490px;
      width: 100%;
      height: 210px;
      cursor: pointer;
      animation: cardSlideIn 0.26s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .lowerthird-box.visible {
      display: flex;
    }

    @keyframes cardSlideIn {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .lt-photo-wrap {
      position: relative;
      width: 170px;
      height: 100%;
      background: #050505;
      flex-shrink: 0;
      overflow: hidden;
      border-right: 1.5px solid rgba(255, 255, 255, 0.35);
    }

    .lt-slider-track {
      display: flex;
      width: 100%;
      height: 100%;
      will-change: transform;
      transition: transform 0.52s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .lt-slide {
      min-width: 100%;
      width: 100%;
      height: 100%;
      flex-shrink: 0;
      overflow: hidden;
    }

    .lt-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .lt-slide-dots {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      gap: 5px;
      background: rgba(0, 0, 0, 0.65);
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      z-index: 4;
    }

    .lt-slide-dots.show {
      display: flex;
    }

    .lt-slide-dots span {
      width: 5.5px;
      height: 5.5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.38);
      transition: background 0.25s ease, transform 0.25s ease;
    }

    .lt-slide-dots span.active-dot {
      background: #ffffff;
      transform: scale(1.2);
    }

    .lt-info {
      flex: 1;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(135deg, #121216 0%, #070709 100%);
      min-width: 0;
    }

    .lt-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .lt-key-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 34px;
      height: 34px;
      padding: 0 10px;
      border-radius: 9px;
      background: #ffffff;
      color: #000000;
      font-weight: 800;
      font-size: 0.92rem;
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.6);
      transition: transform 0.2s ease;
    }

    .lt-text-group {
      margin-top: auto;
      transition: opacity 0.18s ease, transform 0.2s ease;
    }

    .lt-text-group.fade-step {
      opacity: 0;
      transform: translateY(4px);
    }

    .lt-title {
      font-size: 1.12rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }

    .lt-sub {
      font-size: 0.82rem;
      color: #d4d4d8;
      line-height: 1.42;
    }

    /* Subtle bottom progress line during ESC A-Z reel */
    .reel-bar {
      position: absolute;
      left: 0;
      bottom: 0;
      height: 2.5px;
      width: 0%;
      background: #ffffff;
      box-shadow: 0 0 8px #ffffff;
      opacity: 0;
      transition: width 0.5s linear, opacity 0.2s ease;
    }

    .reel-bar.active {
      opacity: 1;
    }

    /* =====================================================================
       CLEAN BLACK & WHITE AZERTY KEYBOARD + WHITE LED MATRIX FLASHES
       ===================================================================== */
    .kb-outer {
      width: 100%;
      max-width: 1220px;
      display: flex;
      justify-content: center;
    }

    .keyboard-chassis {
      width: 100%;
      background: var(--kb-bg);
      border: 3px solid var(--kb-frame);
      border-radius: clamp(16px, 2.2vw, 28px);
      padding: clamp(8px, 1.6vw, 20px);
      display: flex;
      gap: clamp(6px, 1.4vw, 18px);
      box-shadow:
        0 0 28px rgba(255, 255, 255, 0.1),
        0 20px 60px rgba(0, 0, 0, 0.95);
    }

    .kb-main {
      flex: 14.5;
      display: flex;
      flex-direction: column;
      gap: clamp(4px, 0.55vw, 7px);
      min-width: 0;
    }

    .kb-numpad {
      flex: 4;
      display: flex;
      flex-direction: column;
      gap: clamp(4px, 0.55vw, 7px);
      min-width: 0;
    }

    .kb-row {
      display: flex;
      gap: clamp(4px, 0.55vw, 7px);
      width: 100%;
      align-items: stretch;
    }

    .mobile-only {
      display: none !important;
    }

    .keycap {
      --flash-delay: 0ms;
      position: relative;
      flex: 1;
      aspect-ratio: 1 / 1;
      background: #0a0a0d;
      border: 1.6px solid var(--key-outer);
      border-radius: clamp(6px, 0.9vw, 11px);
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(0.58rem, 1.12vw, 0.98rem);
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(255, 255, 255, 0.05);
      transition:
        opacity 0.24s ease,
        transform 0.16s ease,
        background 0.24s ease,
        box-shadow 0.24s ease,
        border-color 0.24s ease;
      min-width: 0;
      padding: 0;
    }

    .keycap::after {
      content: "";
      position: absolute;
      inset: clamp(1.5px, 0.2vw, 2.5px);
      border: 1.4px solid var(--key-inner);
      border-radius: clamp(4px, 0.7vw, 8px);
      pointer-events: none;
    }

    .keycap:hover {
      background: #18181f;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.25);
    }

    /* Clean Monochrome White LED Flash Wave Across Keys */
    .keycap.led-wave {
      animation: whiteLedFlash 0.48s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: var(--flash-delay);
    }

    @keyframes whiteLedFlash {
      0% {
        background: #0a0a0d;
      }
      35% {
        opacity: 1;
        background: rgba(255, 255, 255, 0.32);
        border-color: #ffffff;
        box-shadow: 0 0 18px rgba(255, 255, 255, 0.85), inset 0 0 10px rgba(255, 255, 255, 0.65);
      }
      100% {
        background: #0a0a0d;
        border-color: var(--key-outer);
        box-shadow: 0 2px 6px rgba(255, 255, 255, 0.05);
      }
    }

    .keycap.pill {
      aspect-ratio: 2.1 / 1;
      border-radius: 999px;
      font-size: clamp(0.42rem, 0.75vw, 0.68rem);
    }

    .keycap.pill::after {
      border-radius: 999px;
    }

    .keycap.w-half  { flex: 0.58; aspect-ratio: auto; }
    .keycap.w-tab   { flex: 1.48; aspect-ratio: auto; }
    .keycap.w-caps  { flex: 1.82; aspect-ratio: auto; }
    .keycap.w-shift { flex: 2.25; aspect-ratio: auto; }
    .keycap.w-ctrl  { flex: 0.9;  aspect-ratio: auto; }
    .keycap.w-space { flex: 5.2;  aspect-ratio: auto; }
    .keycap.w-fill  { flex: 1.5;  aspect-ratio: auto; }

    /* =====================================================================
       SUBTLE DIMMING + CRISP WHITE GLOW ON ACTIVE KEY
       ===================================================================== */
    .keyboard-chassis.dim-mode .keycap:not(.active-key):not(.led-wave) {
      opacity: 0.48;
    }

    .keycap.active-key,
    .keycap.intro-lit {
      opacity: 1 !important;
      background: rgba(255, 255, 255, 0.34);
      border-color: #ffffff;
      box-shadow:
        0 0 24px #ffffff,
        0 0 10px rgba(255, 255, 255, 0.9),
        inset 0 0 14px rgba(255, 255, 255, 0.85);
      transform: translateY(1px);
      z-index: 2;
    }

    .keycap.active-key::after,
    .keycap.intro-lit::after {
      border-color: #ffffff;
      box-shadow: inset 0 0 10px #ffffff;
    }

    .multi-dots {
      position: absolute;
      bottom: 11%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 2.5px;
    }

    .multi-dots span {
      width: 3.5px;
      height: 3.5px;
      border-radius: 50%;
      background: #ffffff;
    }

    .lbl-tl { position: absolute; top: 12%; left: 14%; font-size: 0.68em; line-height: 1; }
    .lbl-tr { position: absolute; top: 12%; right: 14%; font-size: 0.68em; line-height: 1; }
    .lbl-bl { position: absolute; bottom: 12%; left: 14%; font-size: 0.68em; line-height: 1; }
    .lbl-br { position: absolute; bottom: 12%; right: 14%; font-size: 0.68em; line-height: 1; }
    .lbl-c  { font-size: 1em; font-weight: 600; }
    .lbl-sm { font-size: 0.72em; }

    .numpad-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: clamp(4px, 0.55vw, 7px);
    }

    .numpad-grid .keycap {
      aspect-ratio: auto;
      width: 100%;
      height: 100%;
    }

    .split-arrows {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .split-arrows .keycap {
      aspect-ratio: auto;
      flex: 1;
      border-radius: 4px;
      font-size: 0.65em;
    }

    /* =====================================================================
       CLEAN MOBILE AZERTY KEYBOARD
       ===================================================================== */
    @media (max-width: 768px) {
      .stage-area {
        min-height: 195px;
      }

      .lowerthird-box {
        height: 174px;
        max-width: 96vw;
      }

      .lt-photo-wrap {
        width: 132px;
      }

      .lt-title {
        font-size: 1rem;
      }

      .lt-sub {
        font-size: 0.75rem;
      }

      .keyboard-chassis {
        padding: 10px 8px;
        border-radius: 22px;
        border-width: 2.5px;
      }

      .kb-main {
        gap: 6px;
      }

      .kb-row {
        gap: 4.5px;
      }

      .kb-numpad,
      .hide-mobile {
        display: none !important;
      }

      .mobile-only {
        display: flex !important;
      }

      .keycap {
        aspect-ratio: auto;
        height: 46px;
        font-size: 0.92rem;
        border-radius: 8px;
        border-width: 1.2px;
      }

      .keycap::after {
        inset: 1.5px;
        border-width: 1.1px;
        border-radius: 6px;
      }

      .lbl-tl {
        top: 4px;
        left: 4px;
        font-size: 0.54em;
        opacity: 0.88;
      }

      .lbl-br {
        bottom: 4px;
        right: 4px;
        font-size: 0.54em;
        opacity: 0.88;
      }

      .keycap.has-dots .lbl-c {
        transform: translateY(-2px);
      }

      .multi-dots {
        bottom: 5px;
        gap: 2px;
      }

      .multi-dots span {
        width: 3px;
        height: 3px;
      }
    }
  </style>
</head>
<body>

  <!-- Stage: Minimal Intro Text & Single Lower-Third Card -->
  <div class="stage-area">
    <div class="intro-word-banner" id="introWordBanner"></div>

    <div class="lowerthird-box" id="lowerthirdBox">
      <div class="lt-photo-wrap">
        <div class="lt-slider-track" id="ltSliderTrack"></div>
        <div class="lt-slide-dots" id="ltSlideDots"></div>
      </div>
      <div class="lt-info">
        <div class="lt-top-row">
          <span class="lt-key-pill" id="ltKeyPill">A</span>
        </div>
        <div class="lt-text-group" id="ltTextGroup">
          <div class="lt-title" id="ltTitle">Anniversary</div>
          <div class="lt-sub" id="ltSub">Celebrating us and every milestone with my sayang.</div>
        </div>
      </div>
      <div class="reel-bar" id="reelBar"></div>
    </div>
  </div>

  <!-- Clean Black & White Belgian AZERTY Keyboard -->
  <div class="kb-outer">
    <div class="keyboard-chassis" id="kbChassis">

      <div class="kb-main">
        <!-- Row 1: Desktop Function Pill Keys -->
        <div class="kb-row hide-mobile">
          <button type="button" class="keycap pill" data-esc="true"><span class="lbl-sm">esc</span></button>
          <button type="button" class="keycap pill"><span class="lbl-tl">1</span><span class="lbl-br">f1</span></button>
          <button type="button" class="keycap pill"><span class="lbl-tl">☼-</span><span class="lbl-br">f2</span></button>
          <button type="button" class="keycap pill" data-wave="true"><span class="lbl-tl">☼+</span><span class="lbl-br">f3</span></button>
          <button type="button" class="keycap pill"><span class="lbl-tl">▭</span><span class="lbl-br">f4</span></button>
          <button type="button" class="keycap pill"><span class="lbl-tl">⊞</span><span class="lbl-br">f5</span></button>
          <button type="button" class="keycap pill"><span class="lbl-tl">🔇</span><span class="lbl-br">f6</span></button>
          <button type="button" class="keycap pill"><span class="lbl-tl">🔉</span><span class="lbl-br">f7</span></button>
          <button type="button" class="keycap pill"><span class="lbl-tl">🔊</span><span class="lbl-br">f8</span></button>
          <button type="button" class="keycap pill"><span class="lbl-tl">|◀◀</span><span class="lbl-br">f9</span></button>
          <button type="button" class="keycap pill"><span class="lbl-tl">▶|</span><span class="lbl-br">f10</span></button>
          <button type="button" class="keycap pill"><span class="lbl-tl">▶▶|</span><span class="lbl-br">f11</span></button>
          <button type="button" class="keycap pill"><span class="lbl-tl">✈</span><span class="lbl-br">f12</span></button>
          <button type="button" class="keycap pill"><span class="lbl-sm">prt scr</span></button>
          <button type="button" class="keycap pill" data-clear="true"><span class="lbl-sm">delete</span></button>
        </div>

        <!-- Row 2: Number Row (1 through 0) -->
        <div class="kb-row">
          <button type="button" class="keycap w-half hide-mobile"><span class="lbl-tl">³</span><span class="lbl-bl">²</span></button>
          <button type="button" class="keycap"><span class="lbl-tl">1</span><span class="lbl-c">&amp;</span><span class="lbl-br">|</span></button>
          <button type="button" class="keycap" data-key="@"><span class="lbl-tl">2</span><span class="lbl-c">é</span><span class="lbl-br">@</span></button>
          <button type="button" class="keycap"><span class="lbl-tl">3</span><span class="lbl-c">"</span><span class="lbl-br">#</span></button>
          <button type="button" class="keycap"><span class="lbl-tl">4</span><span class="lbl-c">'</span></button>
          <button type="button" class="keycap"><span class="lbl-tl">5</span><span class="lbl-c">(</span></button>
          <button type="button" class="keycap"><span class="lbl-tl">6</span><span class="lbl-c">§</span><span class="lbl-br">^</span></button>
          <button type="button" class="keycap"><span class="lbl-tl">7</span><span class="lbl-c">è</span></button>
          <button type="button" class="keycap"><span class="lbl-tl">8</span><span class="lbl-c">!</span></button>
          <button type="button" class="keycap"><span class="lbl-tl">9</span><span class="lbl-c">ç</span><span class="lbl-br">{</span></button>
          <button type="button" class="keycap"><span class="lbl-tl">0</span><span class="lbl-c">à</span><span class="lbl-br">}</span></button>
          <button type="button" class="keycap hide-mobile"><span class="lbl-tl">°</span><span class="lbl-c">)</span></button>
          <button type="button" class="keycap hide-mobile"><span class="lbl-tl">-</span><span class="lbl-c">_</span></button>
        </div>

        <!-- Row 3: AZERTY Row -->
        <div class="kb-row">
          <button type="button" class="keycap w-tab hide-mobile"><span class="lbl-tl">|←</span><span class="lbl-bl">→|</span></button>
          <button type="button" class="keycap" data-key="A"><span class="lbl-c">A</span></button>
          <button type="button" class="keycap" data-key="Z"><span class="lbl-c">Z</span></button>
          <button type="button" class="keycap" data-key="E"><span class="lbl-c">E</span></button>
          <button type="button" class="keycap" data-key="R"><span class="lbl-c">R</span></button>
          <button type="button" class="keycap" data-key="T"><span class="lbl-c">T</span></button>
          <button type="button" class="keycap" data-key="Y"><span class="lbl-c">Y</span></button>
          <button type="button" class="keycap" data-key="U"><span class="lbl-c">U</span></button>
          <button type="button" class="keycap" data-key="I"><span class="lbl-c">I</span></button>
          <button type="button" class="keycap" data-key="O"><span class="lbl-c">O</span></button>
          <button type="button" class="keycap" data-key="P"><span class="lbl-c">P</span></button>
          <button type="button" class="keycap hide-mobile"><span class="lbl-tl">¨</span><span class="lbl-c">^</span><span class="lbl-br">[</span></button>
          <button type="button" class="keycap hide-mobile"><span class="lbl-tl">*</span><span class="lbl-c">$</span><span class="lbl-br">]</span></button>
          <button type="button" class="keycap w-fill hide-mobile"><span class="lbl-tl">E</span><span class="lbl-c">µ</span><span class="lbl-br">`</span></button>
        </div>

        <!-- Row 4: QSDFGHJKLM Row -->
        <div class="kb-row">
          <button type="button" class="keycap w-caps hide-mobile"><span class="lbl-sm">shift lock</span></button>
          <button type="button" class="keycap" data-key="Q"><span class="lbl-c">Q</span></button>
          <button type="button" class="keycap" data-key="S"><span class="lbl-c">S</span></button>
          <button type="button" class="keycap" data-key="D"><span class="lbl-c">D</span></button>
          <button type="button" class="keycap" data-key="F"><span class="lbl-c">F</span></button>
          <button type="button" class="keycap" data-key="G"><span class="lbl-c">G</span></button>
          <button type="button" class="keycap" data-key="H"><span class="lbl-c">H</span></button>
          <button type="button" class="keycap" data-key="J"><span class="lbl-c">J</span></button>
          <button type="button" class="keycap" data-key="K"><span class="lbl-c">K</span></button>
          <button type="button" class="keycap" data-key="L"><span class="lbl-c">L</span></button>
          <button type="button" class="keycap" data-key="M"><span class="lbl-c">M</span></button>
          <button type="button" class="keycap hide-mobile"><span class="lbl-tl">%</span><span class="lbl-c">ù</span><span class="lbl-br">´</span></button>
          <button type="button" class="keycap w-fill hide-mobile"><span class="lbl-c">↵</span></button>
        </div>

        <!-- Row 5: WXCVBN Row (Mobile: esc on left, W X C V B N in center, . on right) -->
        <div class="kb-row">
          <button type="button" class="keycap w-shift hide-mobile"><span class="lbl-c">↑</span></button>
          <button type="button" class="keycap mobile-only" style="flex: 1.65;" data-esc="true"><span class="lbl-sm" style="font-weight:700;">esc</span></button>
          <button type="button" class="keycap" data-key="W"><span class="lbl-c">W</span></button>
          <button type="button" class="keycap" data-key="X"><span class="lbl-c">X</span></button>
          <button type="button" class="keycap" data-key="C"><span class="lbl-c">C</span></button>
          <button type="button" class="keycap" data-key="V"><span class="lbl-c">V</span></button>
          <button type="button" class="keycap" data-key="B"><span class="lbl-c">B</span></button>
          <button type="button" class="keycap" data-key="N"><span class="lbl-c">N</span></button>
          <button type="button" class="keycap mobile-only" style="flex: 1.65;" data-wave="true"><span class="lbl-c">.</span></button>
          <button type="button" class="keycap hide-mobile"><span class="lbl-tl">?</span><span class="lbl-c">,</span></button>

    function createImageWithFallback(filename, altText) {
      const img = document.createElement("img");
      img.alt = altText;
      const encoded = encodeURIComponent(filename);
      const paths = [encoded, `memories/${encoded}`, `public/memories/${encoded}`];
      let tryIdx = 0;
      img.onerror = () => {
        tryIdx++;
        if (tryIdx < paths.length) img.src = paths[tryIdx];
      };
      img.src = paths[0];
      return img;
    }

    function preloadAllImages() {
      const seen = new Set();
      Object.values(KEY_MEMORIES).forEach((entry) => {
        entry.files.forEach((file) => {
          if (seen.has(file)) return;
          seen.add(file);
          createImageWithFallback(file, "");
        });
      });
    }

    // =========================================================================
    // 2. MONOCHROME WHITE LED KEYBOARD WAVE ENGINE
    // =========================================================================
    const chassis = document.getElementById("kbChassis");
    const allKeycaps = Array.from(document.querySelectorAll(".keycap"));

    function updateKeyCoords() {
      const rect = chassis.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      allKeycaps.forEach((btn) => {
        const b = btn.getBoundingClientRect();
        if (!b.width) return;
        btn.dataset.nx = (((b.left + b.width / 2) - rect.left) / rect.width).toFixed(3);
        btn.dataset.ny = (((b.top + b.height / 2) - rect.top) / rect.height).toFixed(3);
      });
    }

    window.addEventListener("resize", updateKeyCoords);

    // Clean diagonal white LED sweep across the board
    function triggerWhiteBoardSweep() {
      allKeycaps.forEach((btn) => {
        if (!btn.dataset.nx) return;
        const nx = parseFloat(btn.dataset.nx);
        const ny = parseFloat(btn.dataset.ny);
        const delayMs = Math.round((nx + ny * 0.35) * 260);
        btn.style.setProperty("--flash-delay", `${delayMs}ms`);
        btn.classList.remove("led-wave");
        void btn.offsetWidth;
        btn.classList.add("led-wave");
      });
    }

    // Tight white radial ripple around a pressed key
    function triggerLocalKeyRipple(k) {
      let origin = null;
      document.querySelectorAll(`.keycap[data-key="${k}"]`).forEach((btn) => {
        if (btn.offsetWidth > 0) origin = btn;
      });
      if (!origin || !origin.dataset.nx) return;

      const ox = parseFloat(origin.dataset.nx);
      const oy = parseFloat(origin.dataset.ny);

      allKeycaps.forEach((btn) => {
        if (!btn.dataset.nx || btn.dataset.key === k) return;
        const dist = Math.hypot(parseFloat(btn.dataset.nx) - ox, (parseFloat(btn.dataset.ny) - oy) * 0.55);
        if (dist > 0.36) return; // Only ripple nearby neighbor keys
        const delayMs = Math.round(dist * 280);
        btn.style.setProperty("--flash-delay", `${delayMs}ms`);
        btn.classList.remove("led-wave");
        void btn.offsetWidth;
        btn.classList.add("led-wave");
      });
    }

    // =========================================================================
    // 3. INTRO ANIMATION & ESCAPE A-TO-Z REEL (Single Clean Card + Internal Swipe)
    // =========================================================================
    const INTRO_WORDS  = ["AULI@", "I", "LOVE", "YOU", "CUZ", "YOU", "ARE", "SPECIAL"];
    const LETTER_DELAY = 340;
    const WORD_HOLD    = 800;
    const REEL_STEP_MS = 620;

    let introTimers = [];
    let flashTimers = [];
    let isReelPlaying = false;
    let currentKey = null;
    let currentSlideIdx = 0;
    let autoSwipeTimer = null;

    const lowerthirdBox = document.getElementById("lowerthirdBox");
    const introBanner = document.getElementById("introWordBanner");
    const sliderTrack = document.getElementById("ltSliderTrack");
    const slideDots = document.getElementById("ltSlideDots");
    const keyPill = document.getElementById("ltKeyPill");
    const textGroup = document.getElementById("ltTextGroup");
    const reelBar = document.getElementById("reelBar");

    function highlightMatchingKeys(k, withRipple = true) {
      document.querySelectorAll(".keycap.active-key").forEach((el) => el.classList.remove("active-key"));
      document.querySelectorAll(`.keycap[data-key="${k}"]`).forEach((el) => el.classList.add("active-key"));
      if (withRipple) triggerLocalKeyRipple(k);
    }

    function stopIntroAnimation() {
      introTimers.forEach(clearTimeout);
      introTimers = [];
      document.querySelectorAll(".keycap.intro-lit").forEach((el) => el.classList.remove("intro-lit"));
      introBanner.classList.remove("active");
      introBanner.innerHTML = "";
    }

    function stopAlphabetFlash() {
      flashTimers.forEach(clearTimeout);
      flashTimers = [];
      isReelPlaying = false;
      reelBar.classList.remove("active");
      reelBar.style.width = "0%";
    }

    function playIntroSequence() {
      stopAlphabetFlash();
      stopIntroAnimation();
      clearSelection();

      introBanner.classList.add("active");
      let elapsed = 220;

      INTRO_WORDS.forEach((word) => {
        const startWordTimer = setTimeout(() => {
          document.querySelectorAll(".keycap.intro-lit").forEach((el) => el.classList.remove("intro-lit"));
          introBanner.innerHTML = "";
        }, elapsed);
        introTimers.push(startWordTimer);

        word.split("").forEach((ch) => {
          elapsed += LETTER_DELAY;
          const letterTimer = setTimeout(() => {
            document.querySelectorAll(`.keycap[data-key="${ch}"]`).forEach((btn) => {
              btn.classList.add("intro-lit");
            });

            const span = document.createElement("span");
            span.className = "intro-letter";
            span.textContent = ch;
            introBanner.appendChild(span);
          }, elapsed);
          introTimers.push(letterTimer);
        });

        elapsed += WORD_HOLD;
      });

      const endTimer = setTimeout(() => {
        stopIntroAnimation();
        triggerWhiteBoardSweep();
      }, elapsed + 150);
      introTimers.push(endTimer);
    }

    // Smooth A-to-Z Reel Inside the Single Lower-Third Card
    function playAlphabetFlash() {
      if (isReelPlaying) {
        stopAlphabetFlash();
        clearSelection();
        return;
      }

      stopIntroAnimation();
      stopAlphabetFlash();
      clearInterval(autoSwipeTimer);
      isReelPlaying = true;

      const alphabetKeys = Object.keys(KEY_MEMORIES)
        .filter((k) => /^[A-Z]$/.test(k))
        .sort();

      // Build one continuous horizontal filmstrip of all A-Z photos
      const steps = [];
      alphabetKeys.forEach((k) => {
        const entry = KEY_MEMORIES[k];
        entry.files.forEach((file, fileIdx) => {
          steps.push({ k, entry, file, fileIdx, count: entry.files.length });
        });
      });

      lowerthirdBox.classList.add("visible");
      sliderTrack.style.transition = "none";
      sliderTrack.innerHTML = "";
      sliderTrack.style.transform = "translateX(0%)";

      steps.forEach((step) => {
        const slide = document.createElement("div");
        slide.className = "lt-slide";
        slide.appendChild(createImageWithFallback(step.file, step.entry.title));
        sliderTrack.appendChild(slide);
      });

      void sliderTrack.offsetWidth;
      sliderTrack.style.transition = "transform 0.52s cubic-bezier(0.22, 1, 0.36, 1)";

      reelBar.classList.add("active");
      reelBar.style.width = "0%";

      let prevKey = null;

      steps.forEach((step, idx) => {
        const timer = setTimeout(() => {
          chassis.classList.add("dim-mode");
          highlightMatchingKeys(step.k, step.k !== prevKey);

          // Glide filmstrip to current photo
          sliderTrack.style.transform = `translateX(-${idx * 100}%)`;
          reelBar.style.width = `${((idx + 1) / steps.length) * 100}%`;

          // Dots for double-photo cards
          slideDots.innerHTML = "";
          if (step.count > 1) {
            slideDots.classList.add("show");
            for (let d = 0; d < step.count; d++) {
              const dot = document.createElement("span");
              if (d === step.fileIdx) dot.classList.add("active-dot");
              slideDots.appendChild(dot);
            }
          } else {
            slideDots.classList.remove("show");
          }

          // Only update title & description when moving to a new letter (so double photos keep their card steady and just swipe the image)
          if (step.k !== prevKey) {
            currentKey = step.k;
            prevKey = step.k;

            if (idx === 0) {
              keyPill.textContent = step.k;
              document.getElementById("ltTitle").textContent = step.entry.title;
              document.getElementById("ltSub").textContent = step.entry.sub;
            } else {
              textGroup.classList.add("fade-
