<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Alphabet Dating — Memory Keyboard</title>
  <style>
    :root {
      --bg: #050508;
      --kb-bg: #030304;
      --kb-frame: #ffffff;
      --key-outer: #d4d4d8;
      --key-inner: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 50% 22%, rgba(255, 255, 255, 0.08) 0%, transparent 55%),
        radial-gradient(circle at 50% 0%, #171721 0%, var(--bg) 75%);
      color: #ffffff;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 14px 10px 18px;
      overflow: hidden;
    }

    /* =====================================================================
       STAGE AREA: 3D INTRO TILES, SINGLE LOWER-THIRD, & 3D ESC COVERFLOW
       ===================================================================== */
    .stage-area {
      width: 100%;
      max-width: 1180px;
      min-height: 240px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      perspective: 1200px;
      margin-bottom: 8px;
    }

    /* 1. 3D Intro Word Tiles */
    .intro-word-banner {
      display: none;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 2vw, 14px);
      min-height: 80px;
      perspective: 900px;
      transform-style: preserve-3d;
    }

    .intro-word-banner.active {
      display: flex;
    }

    .intro-letter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: clamp(42px, 8vw, 62px);
      height: clamp(50px, 9.5vw, 72px);
      padding: 0 12px;
      border-radius: 14px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.05));
      border: 2px solid #ffffff;
      font-size: clamp(1.5rem, 3.8vw, 2.4rem);
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 18px #ffffff;
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.75),
        0 0 24px rgba(255, 255, 255, 0.55),
        inset 0 0 14px rgba(255, 255, 255, 0.45);
      transform-origin: center bottom;
      animation: tile3DIn 0.42s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .intro-word-banner.word-complete .intro-letter {
      animation: wordCompletePulse 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .intro-word-banner.word-exit .intro-letter {
      animation: wordSweepOut 0.26s ease-in forwards;
    }

    @keyframes tile3DIn {
      0% {
        opacity: 0;
        transform: translateY(36px) rotateX(-70deg) scale(0.5);
        filter: blur(6px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) rotateX(0deg) scale(1);
        filter: blur(0);
      }
    }

    @keyframes wordCompletePulse {
      0%   { transform: translateY(0) scale(1); }
      45%  { transform: translateY(-8px) scale(1.1); box-shadow: 0 0 38px #ffffff, inset 0 0 20px #ffffff; }
      100% { transform: translateY(0) scale(1); }
    }

    @keyframes wordSweepOut {
      to {
        opacity: 0;
        transform: translateY(-22px) scale(0.85);
        filter: blur(4px);
      }
    }

    /* 2. Single Key Lower-Third Box with 3D Spring Entrance & Glass Shine */
    .lowerthird-box {
      position: relative;
      display: none;
      align-items: stretch;
      background: #0b0b0e;
      border: 2px solid #ffffff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.92),
        0 0 30px rgba(255, 255, 255, 0.28);
      max-width: 490px;
      width: 100%;
      height: 210px;
      cursor: pointer;
      transform-style: preserve-3d;
    }

    .lowerthird-box.visible {
      display: flex;
      animation: cardSpringIn 0.48s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .lowerthird-box::after {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 70%;
      height: 100%;
      background: linear-gradient(
        105deg,
        transparent 20%,
        rgba(255, 255, 255, 0.22) 50%,
        transparent 80%
      );
      pointer-events: none;
      z-index: 6;
    }

    .lowerthird-box.shine::after {
      animation: glassSweep 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes glassSweep {
      from { left: -80%; }
      to   { left: 140%; }
    }

    @keyframes cardSpringIn {
      0% {
        opacity: 0;
        transform: translateY(28px) rotateX(-22deg) scale(0.88);
      }
      100% {
        opacity: 1;
        transform: translateY(0) rotateX(0deg) scale(1);
      }
    }

    .lt-photo-wrap {
      position: relative;
      width: 170px;
      height: 100%;
      background: #050505;
      flex-shrink: 0;
      overflow: hidden;
      border-right: 1.5px solid rgba(255, 255, 255, 0.35);
    }

    .lt-slider-track {
      display: flex;
      width: 100%;
      height: 100%;
      will-change: transform;
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .lt-slide {
      min-width: 100%;
      width: 100%;
      height: 100%;
      flex-shrink: 0;
      overflow: hidden;
    }

    .lt-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scale(1.06);
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1), filter 0.55s ease;
    }

    .lt-slide.active-slide img {
      transform: scale(1);
    }

    .lt-slide-dots {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      gap: 5px;
      background: rgba(0, 0, 0, 0.65);
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      z-index: 4;
    }

    .lt-slide-dots.show {
      display: flex;
    }

    .lt-slide-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      transition: background 0.25s ease, transform 0.25s ease;
    }

    .lt-slide-dots span.active-dot {
      background: #ffffff;
      transform: scale(1.25);
    }

    .lt-info {
      flex: 1;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(135deg, #15151b 0%, #070709 100%);
      min-width: 0;
    }

    .lt-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .lt-key-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 34px;
      height: 34px;
      padding: 0 10px;
      border-radius: 9px;
      background: #ffffff;
      color: #000000;
      font-weight: 800;
      font-size: 0.92rem;
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.75);
    }

    .lt-text-group {
      margin-top: auto;
    }

    .lt-title {
      font-size: 1.12rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }

    .lt-sub {
      font-size: 0.82rem;
      color: #d4d4d8;
      line-height: 1.42;
    }

    /* =====================================================================
       3. 3D COVERFLOW CARD CASCADE FOR ESC A-TO-Z REEL
       ===================================================================== */
    .reel-deck {
      position: relative;
      display: none;
      width: 100%;
      max-width: 900px;
      height: 220px;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      perspective: 1200px;
    }

    .reel-deck.active {
      display: flex;
    }

    .reel-card {
      position: absolute;
      width: min(88vw, 460px);
      height: 204px;
      display: flex;
      align-items: stretch;
      background: #0b0b0e;
      border: 2px solid #ffffff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 28px rgba(255, 255, 255, 0.25);
      will-change: transform, opacity, filter;
      transition:
        transform 0.56s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1),
        filter 0.5s ease,
        box-shadow 0.5s ease;
      pointer-events: none;
    }

    .reel-card .lt-photo-wrap {
      width: 162px;
    }

    /* 3D Coverflow Positions */
    .reel-card[data-pos="0"] {
      transform: translate3d(0%, 0px, 0px) rotateY(0deg) scale(1);
      opacity: 1;
      filter: brightness(1);
      z-index: 10;
      box-shadow: 0 22px 55px rgba(0, 0, 0, 0.95), 0 0 36px rgba(255, 255, 255, 0.45);
    }

    .reel-card[data-pos="1"] {
      transform: translate3d(54%, -4px, -140px) rotateY(-28deg) scale(0.84);
      opacity: 0.52;
      filter: brightness(0.65) blur(1px);
      z-index: 7;
    }

    .reel-card[data-pos="2"] {
      transform: translate3d(88%, -10px, -260px) rotateY(-40deg) scale(0.68);
      opacity: 0.2;
      filter: brightness(0.45) blur(2px);
      z-index: 4;
    }

    .reel-card[data-pos="-1"] {
      transform: translate3d(-54%, -4px, -140px) rotateY(28deg) scale(0.84);
      opacity: 0.52;
      filter: brightness(0.65) blur(1px);
      z-index: 7;
    }

    .reel-card[data-pos="-2"] {
      transform: translate3d(-88%, -10px, -260px) rotateY(40deg) scale(0.68);
      opacity: 0.2;
      filter: brightness(0.45) blur(2px);
      z-index: 4;
    }

      transform: translate3d(115%, -16px, -360px) rotateY(-48deg) scale(0.55);
      opacity: 0;
      z-index: 1;
    }
