<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Alphabet Dating — Memory Keyboard</title>
  <style>
    :root {
      --bg: #070709;
      --kb-bg: #030304;
      --kb-frame: #ffffff;
      --key-outer: #d4d4d8;
      --key-inner: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 15%, #16161d 0%, var(--bg) 75%);
      color: #ffffff;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 14px 12px 22px;
      overflow-x: hidden;
    }

    .utility-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }

    .util-btn {
      background: #141418;
      border: 1px solid #52525b;
      color: #f4f4f5;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.72rem;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .util-btn:hover {
      border-color: #ffffff;
      background: #27272a;
    }

    #mobileModeBtn {
      display: none;
    }

    /* =====================================================================
       COMPACT LOWER-THIRD STAGE + INTRO WORD DISPLAY
       ===================================================================== */
    .stage-area {
      width: 100%;
      max-width: 1180px;
      min-height: 225px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 10px;
    }

    .intro-word-banner {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 64px;
      font-size: clamp(1.9rem, 4vw, 3rem);
      font-weight: 800;
      letter-spacing: 0.22em;
    }

    .intro-word-banner.active {
      display: flex;
    }

    .intro-letter {
      display: inline-block;
      color: #ffffff;
      text-shadow: 0 0 22px #ffffff, 0 0 10px rgba(255, 255, 255, 0.8);
      animation: letterPop 0.26s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes letterPop {
      from { opacity: 0; transform: translateY(10px) scale(0.75); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .idle-hint {
      color: #a1a1aa;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      text-align: center;
      padding: 12px 20px;
      border: 1px dashed #3f3f46;
      border-radius: 999px;
    }

    .lowerthird-box {
      display: none;
      align-items: stretch;
      background: #0b0b0e;
      border: 2px solid #ffffff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.9), 0 0 28px rgba(255, 255, 255, 0.22);
      max-width: 490px;
      width: 100%;
      height: 210px;
      cursor: pointer;
      animation: ltSlideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .lowerthird-box.visible {
      display: flex;
    }

    @keyframes ltSlideUp {
      from { opacity: 0; transform: translateY(10px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Auto-Swipe Carousel Viewport */
    .lt-photo-wrap {
      position: relative;
      width: 170px;
      height: 100%;
      background: #050505;
      flex-shrink: 0;
      overflow: hidden;
      border-right: 1.5px solid rgba(255, 255, 255, 0.35);
    }

    .lt-slider-track {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .lt-slide {
      min-width: 100%;
      width: 100%;
      height: 100%;
      flex-shrink: 0;
    }

    .lt-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Small Dots on Photo When Auto-Swiping 2 Images */
    .lt-slide-dots {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      gap: 5px;
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .lt-slide-dots.show {
      display: flex;
    }

    .lt-slide-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      transition: background 0.25s ease, transform 0.25s ease;
    }

    .lt-slide-dots span.active-dot {
      background: #ffffff;
      transform: scale(1.2);
    }

    /* Lower-Third Text Side */
    .lt-info {
      flex: 1;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(135deg, #141418 0%, #070709 100%);
      min-width: 0;
    }

    .lt-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .lt-key-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 34px;
      height: 34px;
      padding: 0 10px;
      border-radius: 9px;
      background: #ffffff;
      color: #000000;
      font-weight: 800;
      font-size: 0.92rem;
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.65);
    }

    .lt-text-group {
      margin-top: auto;
    }

    .lt-title {
      font-size: 1.12rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }

    .lt-sub {
      font-size: 0.82rem;
      color: #d4d4d8;
      line-height: 1.42;
    }

    /* =====================================================================
       BRIGHTER BLACK & WHITE AZERTY KEYBOARD
       ===================================================================== */
    .kb-outer {
      width: 100%;
      max-width: 1220px;
      display: flex;
      justify-content: center;
    }

    .keyboard-chassis {
      width: 100%;
      background: var(--kb-bg);
      border: 3px solid var(--kb-frame);
      border-radius: clamp(14px, 2.2vw, 28px);
      padding: clamp(8px, 1.6vw, 20px);
      display: flex;
      gap: clamp(6px, 1.4vw, 18px);
      box-shadow:
        0 0 30px rgba(255, 255, 255, 0.12),
        0 20px 60px rgba(0, 0, 0, 0.95);
    }

    .kb-main {
      flex: 14.5;
      display: flex;
      flex-direction: column;
      gap: clamp(3px, 0.55vw, 7px);
      min-width: 0;
    }

    .kb-numpad {
      flex: 4;
      display: flex;
      flex-direction: column;
      gap: clamp(3px, 0.55vw, 7px);
      min-width: 0;
    }

    .kb-row {
      display: flex;
      gap: clamp(3px, 0.55vw, 7px);
      width: 100%;
      align-items: stretch;
    }

    .keycap {
      position: relative;
      flex: 1;
      aspect-ratio: 1 / 1;
      background: #0a0a0d;
      border: 1.6px solid var(--key-outer);
      border-radius: clamp(5px, 0.9vw, 11px);
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(0.58rem, 1.12vw, 0.98rem);
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(255, 255, 255, 0.06);
      transition: opacity 0.2s ease, filter 0.2s ease, transform 0.12s ease, background 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      min-width: 0;
      padding: 0;
    }

    .keycap::after {
      content: "";
      position: absolute;
      inset: clamp(1px, 0.2vw, 2.5px);
      border: 1.5px solid var(--key-inner);
      border-radius: clamp(3px, 0.7vw, 8px);
      pointer-events: none;
    }

    .keycap:hover {
      background: #18181f;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.25);
    }

    .keycap.pill {
      aspect-ratio: 2.1 / 1;
      border-radius: 999px;
      font-size: clamp(0.42rem, 0.75vw, 0.68rem);
    }

    .keycap.pill::after {
      border-radius: 999px;
    }

    .keycap.w-half  { flex: 0.58; aspect-ratio: auto; }
    .keycap.w-tab   { flex: 1.48; aspect-ratio: auto; }
    .keycap.w-caps  { flex: 1.82; aspect-ratio: auto; }
    .keycap.w-shift { flex: 2.25; aspect-ratio: auto; }
    .keycap.w-ctrl  { flex: 0.9;  aspect-ratio: auto; }
    .keycap.w-space { flex: 5.2;  aspect-ratio: auto; }
    .keycap.w-fill  { flex: 1.5;  aspect-ratio: auto; }

    /* =====================================================================
       SUBTLE DIMMING + STRONG NEON GLOW ON PRESSED OR INTRO-LIT KEY
       ===================================================================== */
    .keyboard-chassis.dim-mode .keycap:not(.active-key) {
      opacity: 0.62;
    }

    .keycap.active-key,
    .keycap.intro-lit {
      opacity: 1 !important;
      background: rgba(255, 255, 255, 0.34);
      border-color: #ffffff;
      box-shadow:
        0 0 24px #ffffff,
        0 0 10px rgba(255, 255, 255, 0.9),
        inset 0 0 14px rgba(255, 255, 255, 0.85);
      transform: translateY(1px);
      z-index: 2;
    }

    .keycap.active-key::after,
    .keycap.intro-lit::after {
      border-color: #ffffff;
      box-shadow: inset 0 0 10px #ffffff;
    }

    .multi-dots {
      position: absolute;
      bottom: 12%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 2.5px;
    }

    .multi-dots span {
      width: 3.5px;
      height: 3.5px;
      border-radius: 50%;
      background: #ffffff;
    }

    .lbl-tl { position: absolute; top: 12%; left: 14%; font-size: 0.68em; line-height: 1; }
    .lbl-tr { position: absolute; top: 12%; right: 14%; font-size: 0.68em; line-height: 1; }
    .lbl-bl { position: absolute; bottom: 12%; left: 14%; font-size: 0.68em; line-height: 1; }
    .lbl-br { position: absolute; bottom: 12%; right: 14%; font-size: 0.68em; line-height: 1; }
    .lbl-c  { font-size: 1em; font-weight: 600; }
    .lbl-sm { font-size: 0.72em; }

    .numpad-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: clamp(3px, 0.55vw, 7px);
    }

    .numpad-grid .keycap {
      aspect-ratio: auto;
      width: 100%;
      height: 100%;
    }

    .split-arrows {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .split-arrows .keycap {
      aspect-ratio: auto;
      flex: 1;
      border-radius: 4px;
      font-size: 0.65em;
    }

    @media (max-width: 768px) {
      #mobileModeBtn {
        display: inline-block;
      }

      .stage-area {
        min-height: 180px;
      }

      .lowerthird-box {
        height: 172px;
        max-width: 96vw;
      }

      .lt-photo-wrap {
        width: 132px;
      }

      .lt-title {
        font-size: 1rem;
      }

      .lt-sub {
        font-size: 0.76rem;
      }

      .keyboard-chassis.mobile-touch .kb-numpad,
      .keyboard-chassis.mobile-touch .hide-mobile {
        display: none !important;
      }

      .keyboard-chassis.mobile-touch .keycap {
        aspect-ratio: auto;
        height: 44px;
        font-size: 0.92rem;
      }
    }
  </style>
</head>
<body>

  <div class="utility-bar">
    <button class="util-btn" id="replayIntroBtn">↻ Replay Intro</button>
    <button class="util-btn" id="mobileModeBtn">📱 Switch to Full Miniature Keyboard</button>
  </div>

  <!-- Compact Lower-Third Display Box & Intro Word Banner -->
  <div class="stage-area">
    <div class="intro-word-banner" id="introWordBanner"></div>

    <div class="idle-hint" id="idleHint">
      Press or tap any key to light it up &amp; open our memory
    </div>

    <div class="lowerthird-box" id="lowerthirdBox">
      <div class="lt-photo-wrap">
        <div class="lt-slider-track" id="ltSliderTrack"></div>
        <div class="lt-slide-dots" id="ltSlideDots"></div>
      </div>
      <div class="lt-info">
        <div class="lt-top-row">
          <span class="lt-key-pill" id="ltKeyPill">A</span>
        </div>
        <div class="lt-text-group">
          <div class="lt-title" id="ltTitle">Anniversary</div>
          <div class="lt-sub" id="ltSub">Celebrating us and every milestone together.</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Brighter Black & White Belgian AZERTY Keyboard -->
  <div class="kb-outer">
    <div class="keyboard-chassis mobile-touch" id="kbChassis">

      <div class="kb-main">
        <!-- Row 1: Function Pill Keys -->
        <div class="kb-row hide-mobile">
          <button type="button" class="keycap pill" data-clear="true"><span class="lbl-sm">esc</span></button>
          <button type="button" class="keycap pill"><span class="lbl-tl">1</span><span class="lbl-br">f1</span></button>
          <button type="button" class="keycap pill"><span class="lbl-tl">☼-</span><span class="lbl-br">f2</span></button>
          <button type="button" class="keycap pill"><span class="lbl-tl">☼+</span><span class="lbl-br">f3</span></button>
          <button type="button" class="keycap pill"><span class="lbl-tl">▭</span><span class="lbl-br">f4</span></button>
          <button type="button" class="keycap pill"><span class="lbl-tl">⊞</span><span class="lbl-br">f5</span></button>
          <button type="button" class="keycap pill"><span class="lbl-tl">🔇</span><span class="lbl-br">f6</span></button>
          <button type="button" class="keycap pill"><span class="lbl-tl">🔉</span><span class="lbl-br">f7</span></button>
          <button type="button" class="keycap pill"><span class="lbl-tl">🔊</span><span class="lbl-br">f8</span></button>
          <button type="button" class="keycap pill"><span class="lbl-tl">|◀◀</span><span class="lbl-br">f9</span></button>
          <button type="button" class="keycap pill"><span class="lbl-tl">▶|</span><span class="lbl-br">f10</span></button>
          <button type="button" class="keycap pill"><span class="lbl-tl">▶▶|</span><span class="lbl-br">f11</span></button>
          <button type="button" class="keycap pill"><span class="lbl-tl">✈</span><span class="lbl-br">f12</span></button>
          <button type="button" class="keycap pill"><span class="lbl-sm">prt scr</span></button>
          <button type="button" class="keycap pill" data-clear="true"><span class="lbl-sm">delete</span></button>
        </div>

        <!-- Row 2: Number Row (2 é @ triggers 2nd A) -->
        <div class="kb-row">
          <button type="button" class="keycap w-half hide-mobile"><span class="lbl-tl">³</span><span class="lbl-bl">²</span></button>
          <button type="button" class="keycap"><span class="lbl-tl">1</span><span class="lbl-c">&amp;</span><span class="lbl-br">|</span></button>
          <button type="button" class="keycap" data-key="@"><span class="lbl-tl">2</span><span class="lbl-c">é</span><span class="lbl-br">@</span></button>
          <button type="button" class="keycap"><span class="lbl-tl">3</span><span class="lbl-c">"</span><span class="lbl-br">#</span></button>
          <button type="button" class="keycap"><span class="lbl-tl">4</span><span class="lbl-c">'</span></button>
          <button type="button" class="keycap"><span class="lbl-tl">5</span><span class="lbl-c">(</span></button>
          <button type="button" class="keycap"><span class="lbl-tl">6</span><span class="lbl-c">§</span><span class="lbl-br">^</span></button>
          <button type="button" class="keycap"><span class="lbl-tl">7</span><span class="lbl-c">è</span></button>
          <button type="button" class="keycap"><span class="lbl-tl">8</span><span class="lbl-c">!</span></button>
          <button type="button" class="keycap"><span class="lbl-tl">9</span><span class="lbl-c">ç</span><span class="lbl-br">{</span></button>
          <button type="button" class="keycap"><span class="lbl-tl">0</span><span class="lbl-c">à</span><span class="lbl-br">}</span></button>
          <button type="button" class="keycap hide-mobile"><span class="lbl-tl">°</span><span class="lbl-c">)</span></button>
          <button type="button" class="keycap hide-mobile"><span class="lbl-tl">-</span><span class="lbl-c">_</span></button>
        </div>

        <!-- Row 3: AZERTY Row -->
        <div class="kb-row">
          <button type="button" class="keycap w-tab hide-mobile"><span class="lbl-tl">|←</span><span class="lbl-bl">→|</span></button>
          <button type="button" class="keycap" data-key="A"><span class="lbl-c">A</span></button>
          <button type="button" class="keycap" data-key="Z"><span class="lbl-c">Z</span></button>
          <button type="button" class="keycap" data-key="E"><span class="lbl-c">E</span></button>
          <button type="button" class="keycap" data-key="R"><span class="lbl-c">R</span></button>
          <button type="button" class="keycap" data-key="T"><span class="lbl-c">T</span></button>
          <button type="button" class="keycap" data-key="Y"><span class="lbl-c">Y</span></button>
          <button type="button" class="keycap" data-key="U"><span class="lbl-c">U</span></button>
          <button type="button" class="keycap" data-key="I"><span class="lbl-c">I</span></button>
          <button type="button" class="keycap" data-key="O"><span class="lbl-c">O</span></button>
          <button type="button" class="keycap" data-key="P"><span class="lbl-c">P</span></button>
          <button type="button" class="keycap hide-mobile"><span class="lbl-tl">¨</span><span class="lbl-c">^</span><span class="lbl-br">[</span></button>
          <button type="button" class="keycap hide-mobile"><span class="lbl-tl">*</span><span class="lbl-c">$</span><span class="lbl-br">]</span></button>
          <button type="button" class="keycap w-fill" data-key="E2"><span class="lbl-tl">E</span><span class="lbl-c">µ</span><span class="lbl-br">`</span></button>
        </div>

        <!-- Row 4: QSDFGHJKLM Row -->
        <div class="kb-row">
          <button type="button" class="keycap w-caps hide-mobile"><span class="lbl-sm">shift lock</span></button>
          <button type="button" class="keycap" data-key="Q"><span class="lbl-c">Q</span></button>
          <button type="button" class="keycap" data-key="S"><span class="lbl-c">S</span></button>
          <button type="button" class="keycap" data-key="D"><span class="lbl-c">D</span></button>
          <button type="button" class="keycap" data-key="F"><span class="lbl-c">F</span></button>
          <button type="button" class="keycap" data-key="G"><span class="lbl-c">G</span></button>
          <button type="button" class="keycap" data-key="H"><span class="lbl-c">H</span></button>
          <button type="button" class="keycap" data-key="J"><span class="lbl-c">J</span></button>
          <button type="button" class="keycap" data-key="K"><span class="lbl-c">K</span></button>
          <button type="button" class="keycap" data-key="L"><span class="lbl-c">L</span></button>
          <button type="button" class="keycap" data-key="M"><span class="lbl-c">M</span></button>
          <button type="button" class="keycap hide-mobile"><span class="lbl-tl">%</span><span class="lbl-c">ù</span><span class="lbl-br">´</span></button>
          <button type="button" class="keycap w-fill hide-mobile"><span class="lbl-c">↵</span></button>
        </div>

        <!-- Row 5: WXCVBN Row -->
        <div class="kb-row">
          <button type="button" class="keycap w-shift hide-mobile"><span class="lbl-c">↑</span></button>
          <button type="button" class="keycap" data-key="W"><span class="lbl-c">W</span></button>
          <button type="button" class="keycap" data-key="X"><span class="lbl-c">X</span></button>
          <button type="button" class="keycap" data-key="C"><span class="lbl-c">C</span></button>
          <button type="button" class="keycap" data-key="V"><span class="lbl-c">V</span></button>
          <button type="button" class="keycap" data-key="B"><span class="lbl-c">B</span></button>
          <button type="button" class="keycap" data-key="N"><span class="lbl-c">N</span></button>
          <button type="button" class="keycap hide-mobile"><span class="lbl-tl">?</span><span class="lbl-c">,</span></button>
          <button type="button" class="keycap hide-mobile"><span class="lbl-tl">.</span><span class="lbl-c">;</span></button>
          <button type="button" class="keycap hide-mobile"><span class="lbl-tl">/</span><span class="lbl-c">:</span></button>
          <button type="button" class="keycap hide-mobile"><span class="lbl-tl">+</span><span class="lbl-c">=</span><span class="lbl-br">~</span></button>
          <button type="button" class="keycap w-fill hide-mobile"></button>
        </div>

        <!-- Row 6: Bottom Space & Arrows -->
        <div class="kb-row hide-mobile">
          <button type="button" class="keycap w-ctrl"><span class="lbl-sm">ctrl</span></button>
          <button type="button" class="keycap w-ctrl"><span class="lbl-sm">fn</span></button>
          <button type="button" class="keycap w-ctrl" aria-label="Win">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="#ffffff">
              <polygon points="0,2.2 6.8,1.2 6.8,7.6 0,7.6"/><polygon points="7.6,1.1 16,0 16,7.6 7.6,7.6"/>
              <polygon points="0,8.4 6.8,8.4 6.8,14.8 0,13.8"/><polygon points="7.6,8.4 16,8.4 16,16 7.6,14.9"/>
            </svg>
          </button>
          <button type="button" class="keycap w-ctrl"><span class="lbl-sm">alt gr</span></button>
          <button type="button" class="keycap w-space" data-clear="true"></button>
          <button type="button" class="keycap w-ctrl"><span class="lbl-sm">alt gr</span></button>
          <button type="button" class="keycap w-ctrl"><span class="lbl-tl">&gt;</span><span class="lbl-c">&lt;</span><span class="lbl-br">\</span></button>
          <button type="button" class="keycap" data-cycle="-1"><span class="lbl-c">‹</span></button>
          <div class="split-arrows">
            <button type="button" class="keycap" data-cycle="-1">▲</button>
            <button type="button" class="keycap" data-cycle="1">▼</button>
          </div>
          <button type="button" class="keycap" data-cycle="1"><span class="lbl-c">›</span></button>
        </div>
      </div>

      <!-- Right Numpad Block -->
      <div class="kb-numpad">
        <div class="kb-row">
          <button type="button" class="keycap pill"></button>
          <button type="button" class="keycap pill"></button>
          <button type="button" class="keycap pill"></button>
          <button type="button" class="keycap pill"></button>
        </div>
        <div class="numpad-grid">
          <button type="button" class="keycap"><span class="lbl-sm" style="line-height:1.05; text-align:center;">num<br>lock</span></button>
          <button type="button" class="keycap"><span class="lbl-c">/</span></button>
          <button type="button" class="keycap"><span class="lbl-c">*</span></button>
          <button type="button" class="keycap"><span class="lbl-c">-</span></button>

          <button type="button" class="keycap"><span class="lbl-c">7</span></button>
          <button type="button" class="keycap"><span class="lbl-c">8</span></button>
          <button type="button" class="keycap"><span class="lbl-c">9</span></button>
          <button type="button" class="keycap" style="grid-row: span 2;"><span class="lbl-c">+</span></button>

          <button type="button" class="keycap"><span class="lbl-c">4</span></button>
          <button type="button" class="keycap"><span class="lbl-c">6</span></button>
          <button type="button" class="keycap"><span class="lbl-c">5</span></button>

          <button type="button" class="keycap"><span class="lbl-c">1</span></button>
          <button type="button" class="keycap"><span class="lbl-c">2</span></button>
          <button type="button" class="keycap"><span class="lbl-c">3</span></button>
          <button type="button" class="keycap" style="grid-row: span 2;"><span class="lbl-c">↵</span></button>

          <button type="button" class="keycap" style="grid-column: span 2;"><span class="lbl-c">0</span></button>
          <button type="button" class="keycap"><span class="lbl-c">.</span></button>
        </div>
      </div>

    </div>
  </div>

  <script>
    // =========================================================================
    // 1. MEMORIES DATA (Your exact custom descriptions)
    // =========================================================================
    const KEY_MEMORIES = {
      "A":  { title: "Anniversary", sub: "Celebrating us and every milestone with my sayang.", files: ["anniversary celebrating.jpeg"] },
      "@":  { title: "Always & Forever", sub: "Celebrating us and every milestone with my sayang.", files: ["anniversary celebrating.jpeg"] },
      "B":  { title: "Birthday Celebration", sub: "Candlelight, cake, and making a wish together.", files: ["birthdaycelebration.jpeg"] },
      "C":  { title: "Cycling in Singapore", sub: "Riding through a beautiful park full of hidden treasures.", files: ["cycling.jpeg"] },
      "D":  { title: "Disney Date", sub: "Cozying up, talking, and reading Disney stories together.", files: ["disneydate.jpeg"] },
      "E":  { title: "Dinner Dates", sub: "Dinner dates are the best fr — since I'm not big on Indonesian food, we always make sure we eat good.", files: ["eating1.jpeg", "eating2.jpeg"] },
      "E2": { title: "X-plore", sub: "Because each time we meet, we need to catch up and make new memories.", files: ["explore.jpeg"] },
      "F":  { title: "Food Festival", sub: "The moment that finally made me fall in love with Indonesian food.", files: ["food festival.jpeg"] },
      "G":  { title: "Game Time", sub: "Being passionate and trying out a game together for the first time.", files: ["game.jpeg"] },
      "H":  { title: "Ocarina Beach Hike", sub: "Walking along the seaside together at Ocarina Beach Resort.", files: ["hike.jpeg"] },
      "I":  { title: "Ice Skating", sub: "Cooling off from the heat", files: ["iceskating.jpeg"] },
      "J":  { title: "Jeep Ride", sub: "Our first and coldest adventure together.", files: ["jeepride.jpeg"] },
      "K":  { title: "Kart Racing", sub: "We beat every single child on the track.", files: ["kart.jpeg"] },
      "L":  { title: "Light Show", sub: "A night full of glowing lights — as beautiful as you.", files: ["lightshow.jpeg", "lightshow2.jpeg"] },
      "M":  { title: "Movie Night", sub: "Lean back, popcorn and enjoy", files: ["moviedate.jpeg"] },
      "N":  { title: "New Year's Eve", sub: "Riding in the new year together", files: ["newyearcelebrations.jpeg"] },
      "O":  { title: "Island Hopping", sub: "Exploring Bintan and it's peaceful beauty", files: ["oceanview.jpeg"] },
      "P":  { title: "Photobooth", sub: "Capturing our memories with extra attributes.", files: ["photobooth.jpeg", "photobooth2.jpeg"] },
      "Q":  { title: "Quality Time", sub: "No rush, no distractions — just us.", files: ["qualitytime.jpeg", "qualitytime2.jpeg"] },
      "R":  { title: "Reading Together", sub: "Quiet bookstore moments, was fun.", files: ["read.jpeg"] },
      "S":  { title: "Singapore", sub: "Welcome to Singapore, we aren't singa yet", files: ["singapore.jpeg", "singapore2.jpeg"] },
      "T":  { title: "Prambanan, Jogja", sub: "Temple run through Prambanan temples", files: ["templerun.jpeg"] },
      "U":  { title: "Universal Studios", sub: "Pure, endless joy from start to finish.", files: ["universalstudios.jpeg"] },
      "V":  { title: "Kawah Ijen", sub: "We reached the top and had a breathtaking view, thank you sayang!", files: ["volcano.jpeg"] },
      "W":  { title: "Waterpark", sub: "It was fun, chaotic, and something totally different.", files: ["waterpark.jpeg"] },
      "X":  { title: "X-plore", sub: "Because each time we meet, we need to catch up and make new memories.", files: ["explore.jpeg"] },
      "Y":  { title: "Yapping", sub: "Endless talks together.", files: ["yapping.jpeg"] },
      "Z":  { title: "Zen", sub: "Peace is just being right there with you, sayang.", files: ["zen.jpeg"] }
    };

    // =========================================================================
    // 2. WORD-BY-WORD INTRO ANIMATION
    //    Sequence: AULI@, I, LOVE, YOU, CUZ, YOU, ARE, SPECIAL
    // =========================================================================
    const INTRO_WORDS = ["AULI@", "I", "LOVE", "YOU", "CUZ", "YOU", "ARE", "SPECIAL"];
    const LETTER_DELAY = 360; // ms between letters in a word
    const WORD_HOLD    = 850; // ms to keep the completed word lit before next word

    let introTimers = [];
    let currentKey = null;
    let currentSlideIdx = 0;
    let autoSwipeTimer = null;

    const chassis = document.getElementById("kbChassis");
    const lowerthirdBox = document.getElementById("lowerthirdBox");
    const idleHint = document.getElementById("idleHint");
    const introBanner = document.getElementById("introWordBanner");
    const sliderTrack = document.getElementById("ltSliderTrack");
    const slideDots = document.getElementById("ltSlideDots");

    function stopIntroAnimation() {
      introTimers.forEach(clearTimeout);
      introTimers = [];
      document.querySelectorAll(".keycap.intro-lit").forEach((el) => el.classList.remove("intro-lit"));
      introBanner.classList.remove("active");
      introBanner.innerHTML = "";
    }

    function playIntroSequence() {
      stopIntroAnimation();
      clearSelection(false);

      idleHint.style.display = "none";
      introBanner.classList.add("active");

      let elapsed = 250;

      INTRO_WORDS.forEach((word) => {
        // Clear previous word's lit keys and start new word
        const startWordTimer = setTimeout(() => {
          document.querySelectorAll(".keycap.intro-lit").forEach((el) => el.classList.remove("intro-lit"));
          introBanner.innerHTML = "";
        }, elapsed);
        introTimers.push(startWordTimer);

        // Light up each letter of the current word 1-by-1 without dimming previous letters in the word
        word.split("").forEach((ch) => {
          elapsed += LETTER_DELAY;
          const letterTimer = setTimeout(() => {
            const keyBtn = document.querySelector(`.keycap[data-key="${ch}"]`);
            if (keyBtn) {
              keyBtn.classList.add("intro-lit");
            }

            const span = document.createElement("span");
            span.className = "intro-letter";
            span.textContent = ch;
            introBanner.appendChild(span);
          }, elapsed);
          introTimers.push(letterTimer);
        });

        // Hold completed word before moving to the next word
        elapsed += WORD_HOLD;
      });

      // Finish sequence and show idle prompt
      const endTimer = setTimeout(() => {
        stopIntroAnimation();
        if (!currentKey) {
          idleHint.style.display = "block";
        }
      }, elapsed + 300);
      introTimers.push(endTimer);
    }

    document.getElementById("replayIntroBtn").addEventListener("click", playIntroSequence);

    // =========================================================================
    // 3. AUTO-SWIPE CAROUSEL & KEY SELECTION LOGIC
    // =========================================================================
    document.querySelectorAll(".keycap[data-key]").forEach((btn) => {
      const k = btn.dataset.key;
      const entry = KEY_MEMORIES[k];
      if (entry && entry.files && entry.files.length > 1) {
        const dots = document.createElement("div");
        dots.className = "multi-dots";
        dots.innerHTML = "<span></span>".repeat(entry.files.length);
        btn.appendChild(dots);
      }
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        selectKey(k);
      });
    });

    document.querySelectorAll("[data-clear]").forEach((btn) => {
      btn.addEventListener("click", () => clearSelection(true));
    });

    document.querySelectorAll("[data-cycle]").forEach((btn) => {
      btn.addEventListener("click", () => stepSlide(parseInt(btn.dataset.cycle, 10)));
    });

    function createImageWithFallback(filename, altText) {
      const img = document.createElement("img");
      img.alt = altText;
      const encoded = encodeURIComponent(filename);
      const paths = [encoded, `memories/${encoded}`, `public/memories/${encoded}`];
      let tryIdx = 0;
      img.onerror = () => {
        tryIdx++;
        if (tryIdx < paths.length) img.src = paths[tryIdx];
      };
      img.src = paths[0];
      return img;
    }

    function selectKey(k) {
      const entry = KEY_MEMORIES[k];
      if (!entry) return;

      // Stop intro if user presses a key while it's running
      stopIntroAnimation();

      // If pressing the same multi-image key again, swipe immediately to next image
      if (currentKey === k && entry.files.length > 1) {
        stepSlide(1);
        return;
      }

      currentKey = k;
      currentSlideIdx = 0;

      // Light up pressed key and gently soften others
      chassis.classList.add("dim-mode");
      document.querySelectorAll(".keycap.active-key").forEach((el) => el.classList.remove("active-key"));
      const activeBtn = document.querySelector(`.keycap[data-key="${k}"]`);
      if (activeBtn) activeBtn.classList.add("active-key");

      renderLowerThird(k, entry);
    }

    function renderLowerThird(k, entry) {
      clearInterval(autoSwipeTimer);

      idleHint.style.display = "none";
      lowerthirdBox.classList.add("visible");

      sliderTrack.innerHTML = "";
      sliderTrack.style.transform = "translateX(0%)";

      entry.files.forEach((file) => {
        const slide = document.createElement("div");
        slide.className = "lt-slide";
        slide.appendChild(createImageWithFallback(file, entry.title));
        sliderTrack.appendChild(slide);
      });

      slideDots.innerHTML = "";
      if (entry.files.length > 1) {
        slideDots.classList.add("show");
        entry.files.forEach((_, idx) => {
          const dot = document.createElement("span");
          if (idx === 0) dot.classList.add("active-dot");
          slideDots.appendChild(dot);
        });

        autoSwipeTimer = setInterval(() => {
          stepSlide(1, false);
        }, 2800);
      } else {
        slideDots.classList.remove("show");
      }

      document.getElementById("ltKeyPill").textContent = k === "@" ? "2 é @" : (k === "E2" ? "E µ" : k);
      document.getElementById("ltTitle").textContent = entry.title;
      document.getElementById("ltSub").textContent = entry.sub;
    }

    function stepSlide(dir, resetTimer = true) {
      if (!currentKey || !KEY_MEMORIES[currentKey]) return;
      const files = KEY_MEMORIES[currentKey].files;
      if (!files || files.length <= 1) return;

      currentSlideIdx = (currentSlideIdx + dir + files.length) % files.length;
      sliderTrack.style.transform = `translateX(-${currentSlideIdx * 100}%)`;

      const dots = slideDots.querySelectorAll("span");
      dots.forEach((d, idx) => d.classList.toggle("active-dot", idx === currentSlideIdx));

      if (resetTimer) {
        clearInterval(autoSwipeTimer);
        autoSwipeTimer = setInterval(() => stepSlide(1, false), 2800);
      }
    }

    function clearSelection(showHint = true) {
      clearInterval(autoSwipeTimer);
      currentKey = null;
      chassis.classList.remove("dim-mode");
      document.querySelectorAll(".keycap.active-key").forEach((el) => el.classList.remove("active-key"));
      lowerthirdBox.classList.remove("visible");
      if (showHint) idleHint.style.display = "block";
    }

    lowerthirdBox.addEventListener("click", () => stepSlide(1, true));

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        stopIntroAnimation();
        clearSelection(true);
      } else if (e.key === "ArrowRight" || e.key === "ArrowDown") {
        stepSlide(1, true);
      } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
        stepSlide(-1, true);
      } else if (e.key === "@" || e.key === "2" || e.key === "é") {
        selectKey("@");
      } else if (e.key === "µ") {
        selectKey("E2");
      } else if (/^[a-zA-Z]$/.test(e.key)) {
        selectKey(e.key.toUpperCase());
      }
    });

    // Mobile view toggle
    const mobileBtn = document.getElementById("mobileModeBtn");
    mobileBtn.addEventListener("click", () => {
      const isTouch = chassis.classList.toggle("mobile-touch");
      mobileBtn.textContent = isTouch
        ? "📱 Switch to Full Miniature Keyboard"
        : "📱 Switch to Large Mobile Keys";
    });

    // Start intro word sequence automatically on page load
    window.addEventListener("DOMContentLoaded", playIntroSequence);
  </script>
</body>
</html>
