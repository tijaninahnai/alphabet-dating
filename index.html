<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Alphabet Dating — Memory Keyboard</title>
  <style>
    :root {
      --bg: #050508;
      --kb-bg: #030304;
      --kb-frame: #ffffff;
      --key-outer: #d4d4d8;
      --key-inner: #ffffff;
      --active-rgb: #00f0ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 50% 22%, rgba(255, 255, 255, 0.07) 0%, transparent 55%),
        radial-gradient(circle at 50% 0%, #151520 0%, var(--bg) 75%);
      color: #ffffff;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 14px 10px 18px;
      overflow: hidden;
    }

    /* =====================================================================
       STAGE AREA: 3D INTRO TILES, SINGLE LOWER-THIRD, & 3D ESC COVERFLOW
       ===================================================================== */
    .stage-area {
      width: 100%;
      max-width: 1180px;
      min-height: 240px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      perspective: 1200px;
      margin-bottom: 8px;
    }

    /* 1. 3D Intro Word Tiles */
    .intro-word-banner {
      display: none;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 2vw, 14px);
      min-height: 80px;
      perspective: 900px;
      transform-style: preserve-3d;
    }

    .intro-word-banner.active {
      display: flex;
    }

    .intro-letter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: clamp(42px, 8vw, 62px);
      height: clamp(50px, 9.5vw, 72px);
      padding: 0 12px;
      border-radius: 14px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.05));
      border: 2px solid var(--active-rgb);
      font-size: clamp(1.5rem, 3.8vw, 2.4rem);
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 18px var(--active-rgb), 0 0 8px #ffffff;
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.75),
        0 0 26px var(--active-rgb),
        inset 0 0 14px var(--active-rgb);
      transform-origin: center bottom;
      animation: tile3DIn 0.42s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .intro-word-banner.word-complete .intro-letter {
      animation: wordCompletePulse 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .intro-word-banner.word-exit .intro-letter {
      animation: wordSweepOut 0.26s ease-in forwards;
    }

    @keyframes tile3DIn {
      0% {
        opacity: 0;
        transform: translateY(36px) rotateX(-70deg) scale(0.5);
        filter: blur(6px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) rotateX(0deg) scale(1);
        filter: blur(0);
      }
    }

    @keyframes wordCompletePulse {
      0%   { transform: translateY(0) scale(1); }
      45%  {
        transform: translateY(-8px) scale(1.1);
        border-color: #ffffff;
        box-shadow: 0 0 42px var(--active-rgb), 0 0 20px #ffffff, inset 0 0 22px #ffffff;
      }
      100% { transform: translateY(0) scale(1); }
    }

    @keyframes wordSweepOut {
      to {
        opacity: 0;
        transform: translateY(-22px) scale(0.85);
        filter: blur(4px);
      }
    }

    /* 2. Single Key Lower-Third Box with Dynamic RGB Glow */
    .lowerthird-box {
      position: relative;
      display: none;
      align-items: stretch;
      background: #0b0b0e;
      border: 2px solid #ffffff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.92),
        0 0 32px var(--active-rgb),
        0 0 12px rgba(255, 255, 255, 0.35);
      max-width: 490px;
      width: 100%;
      height: 210px;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: box-shadow 0.35s ease, border-color 0.35s ease;
    }

    .lowerthird-box.visible {
      display: flex;
      animation: cardSpringIn 0.48s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .lowerthird-box::after {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 70%;
      height: 100%;
      background: linear-gradient(
        105deg,
        transparent 20%,
        rgba(255, 255, 255, 0.26) 50%,
        transparent 80%
      );
      pointer-events: none;
      z-index: 6;
    }

    .lowerthird-box.shine::after {
      animation: glassSweep 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes glassSweep {
      from { left: -80%; }
      to   { left: 140%; }
    }

    @keyframes cardSpringIn {
      0% {
        opacity: 0;
        transform: translateY(28px) rotateX(-22deg) scale(0.88);
      }
      100% {
        opacity: 1;
        transform: translateY(0) rotateX(0deg) scale(1);
      }
    }

    .lt-photo-wrap {
      position: relative;
      width: 170px;
      height: 100%;
      background: #050505;
      flex-shrink: 0;
      overflow: hidden;
      border-right: 1.5px solid rgba(255, 255, 255, 0.35);
    }

    .lt-slider-track {
      display: flex;
      width: 100%;
      height: 100%;
      will-change: transform;
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .lt-slide {
      min-width: 100%;
      width: 100%;
      height: 100%;
      flex-shrink: 0;
      overflow: hidden;
    }

    .lt-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scale(1.06);
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1), filter 0.55s ease;
    }

    .lt-slide.active-slide img {
      transform: scale(1);
    }

    .lt-slide-dots {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      gap: 5px;
      background: rgba(0, 0, 0, 0.65);
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      z-index: 4;
    }

    .lt-slide-dots.show {
      display: flex;
    }

    .lt-slide-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      transition: background 0.25s ease, transform 0.25s ease;
    }

    .lt-slide-dots span.active-dot {
      background: #ffffff;
      box-shadow: 0 0 8px var(--active-rgb);
      transform: scale(1.25);
    }

    .lt-info {
      flex: 1;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(135deg, #15151b 0%, #070709 100%);
      min-width: 0;
    }

    .lt-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .lt-key-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 34px;
      height: 34px;
      padding: 0 10px;
      border-radius: 9px;
      background: #ffffff;
      color: #000000;
      font-weight: 800;
      font-size: 0.92rem;
      box-shadow: 0 0 18px var(--active-rgb), 0 0 8px #ffffff;
      transition: box-shadow 0.3s ease;
    }

    .lt-text-group {
      margin-top: auto;
    }

    .lt-title {
      font-size: 1.12rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }

    .lt-sub {
      font-size: 0.82rem;
      color: #d4d4d8;
      line-height: 1.42;
    }

    /* =====================================================================
       3. 3D COVERFLOW CARD CASCADE FOR ESC A-TO-Z REEL
       ===================================================================== */
    .reel-deck {
      position: relative;
      display: none;
      width: 100%;
      max-width: 900px;
      height: 220px;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      perspective: 1200px;
    }

    .reel-deck.active {
      display: flex;
    }

    .reel-card {
      position: absolute;
      width: min(88vw, 460px);
      height: 204px;
      display: flex;
      align-items: stretch;
      background: #0b0b0e;
      border: 2px solid #ffffff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 28px rgba(255, 255, 255, 0.25);
      will-change: transform, opacity, filter;
      transition:
        transform 0.56s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1),
        filter 0.5s ease,
        box-shadow 0.5s ease;
      pointer-events: none;
    }

    .reel-card .lt-photo-wrap {
      width: 162px;
    }

    .reel-card[data-pos="0"] {
      transform: translate3d(0%, 0px, 0px) rotateY(0deg) scale(1);
      opacity: 1;
      filter: brightness(1);
      z-index: 10;
      box-shadow:
        0 22px 55px rgba(0, 0, 0, 0.95),
        0 0 38px var(--active-rgb),
        0 0 14px rgba(255, 255, 255, 0.5);
    }

    .reel-card[data-pos="1"] {
      transform: translate3d(54%, -4px, -140px) rotateY(-28deg) scale(0.84);
      opacity: 0.52;
      filter: brightness(0.65) blur(1px);
      z-index: 7;
    }

    .reel-card[data-pos="2"] {
      transform: translate3d(88%, -10px, -260px) rotateY(-40deg) scale(0.68);
      opacity: 0.2;
      filter: brightness(0.45) blur(2px);
      z-index: 4;
    }

    .reel-card[data-pos="-1"] {
      transform: translate3d(-54%, -4px, -140px) rotateY(28deg) scale(0.84);
      opacity: 0.52;
      filter: brightness(0.65) blur(1px);
      z-index: 7;
    }

    .reel-card[data-pos="-2"] {
      transform: translate3d(-88%, -10px, -260px) rotateY(40deg) scale(0.68);
      opacity: 0.2;
      filter: brightness(0.45) blur(2px);
      z-index: 4;
    }

    .reel-card[data-pos="far-right"] {
      transform: translate3d(115%, -16px, -360px) rotateY(-48deg) scale(0.55);
      opacity: 0;
      z-index: 1;
    }

    .reel-card[data-pos="far-left"] {
      transform: translate3d(-115%, -16px, -360px) rotateY(48deg) scale(0.55);
      opacity: 0;
      z-index: 1;
    }

    /* =====================================================================
       MECHANICAL RGB AZERTY KEYBOARD + 2D RADIAL MATRIX RIPPLE
       ===================================================================== */
    .kb-outer {
      width: 100%;
      max-width: 1220px;
      display: flex;
      justify-content: center;
    }

    .keyboard-chassis {
      position: relative;
      width: 100%;
      background: var(--kb-bg);
      border: 3px solid var(--kb-frame);
      border-radius: clamp(16px, 2.2vw, 28px);
      padding: clamp(8px, 1.6vw, 20px);
      display: flex;
      gap: clamp(6px, 1.4vw, 18px);
      animation: chassisUnderglow 8s linear infinite;
    }

    @keyframes chassisUnderglow {
      0%, 100% { box-shadow: 0 0 32px rgba(255, 0, 128, 0.22), 0 20px 60px rgba(0, 0, 0, 0.95); }
      25%      { box-shadow: 0 0 32px rgba(0, 240, 255, 0.22), 0 20px 60px rgba(0, 0, 0, 0.95); }
      50%      { box-shadow: 0 0 32px rgba(0, 255, 136, 0.22), 0 20px 60px rgba(0, 0, 0, 0.95); }
      75%      { box-shadow: 0 0 32px rgba(189, 0, 255, 0.22), 0 20px 60px rgba(0, 0, 0, 0.95); }
    }

    .kb-main {
      flex: 14.5;
      display: flex;
      flex-direction: column;
      gap: clamp(4px, 0.55vw, 7px);
      min-width: 0;
    }

    .kb-numpad {
      flex: 4;
      display: flex;
      flex-direction: column;
      gap: clamp(4px, 0.55vw, 7px);
      min-width: 0;
    }

    .kb-row {
      display: flex;
      gap: clamp(4px, 0.55vw, 7px);
      width: 100%;
      align-items: stretch;
    }

    .mobile-only {
      display: none !important;
    }

    .keycap {
      --kx: 0;
      --ky: 0;
      --ripple-delay: 0ms;
      --ripple-color: #00f0ff;
      position: relative;
      flex: 1;
      aspect-ratio: 1 / 1;
      background: #0a0a0d;
      border: 1.6px solid var(--key-outer);
      border-radius: clamp(6px, 0.9vw, 11px);
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(0.58rem, 1.12vw, 0.98rem);
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(255, 255, 255, 0.06);
      transition:
        opacity 0.25s ease,
        transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
        background 0.22s ease,
        box-shadow 0.22s ease,
        border-color 0.22s ease;
      min-width: 0;
      padding: 0;
    }

    .keycap::after {
      content: "";
      position: absolute;
      inset: clamp(1.5px, 0.2vw, 2.5px);
      border: 1.4px solid var(--key-inner);
      border-radius: clamp(4px, 0.7vw, 8px);
      pointer-events: none;
      transition: border-color 0.22s ease, box-shadow 0.22s ease;
    }

    /* Ambient Diagonal Mechanical RGB Spectrum Wave */
    .keyboard-chassis.rgb-ambient .keycap:not(.active-key):not(.intro-lit) {
      animation: ambientRgbWave 6s linear infinite;
      animation-delay: calc((var(--kx) * -2.2s) - (var(--ky) * 0.9s));
    }

    @keyframes ambientRgbWave {
      0%, 100% { border-color: #ff2a85; box-shadow: 0 0 9px rgba(255, 42, 133, 0.28); }
      20%      { border-color: #ff9900; box-shadow: 0 0 9px rgba(255, 153, 0, 0.28); }
      40%      { border-color: #00ff88; box-shadow: 0 0 9px rgba(0, 255, 136, 0.28); }
      60%      { border-color: #00e5ff; box-shadow: 0 0 9px rgba(0, 229, 255, 0.28); }
      80%      { border-color: #b744ff; box-shadow: 0 0 9px rgba(183, 68, 255, 0.28); }
    }

    /* 2D Radial RGB Ripple Wave Across Neighboring Keys */
    .keycap.rgb-ripple {
      animation: radialKeyFlash 0.62s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
      animation-delay: var(--ripple-delay) !important;
    }

    @keyframes radialKeyFlash {
      0% {
        border-color: var(--key-outer);
      }
      32% {
        background: rgba(255, 255, 255, 0.28);
        border-color: var(--ripple-color);
        box-shadow: 0 0 22px var(--ripple-color), inset 0 0 12px var(--ripple-color);
        transform: translateY(-2.5px) scale(1.04);
      }
      100% {
        background: #0a0a0d;
        border-color: var(--key-outer);
        box-shadow: 0 2px 6px rgba(255, 255, 255, 0.06);
        transform: translateY(0) scale(1);
      }
    }

    /* Expanding Neon Shockwave Ring on the Triggered Key Itself */
    .keycap.pulse-wave::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      border: 2px solid var(--active-rgb);
      box-shadow: 0 0 22px var(--active-rgb), 0 0 10px #ffffff;
      pointer-events: none;
      animation: keyShockwave 0.58s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes keyShockwave {
      0%   { opacity: 1; transform: scale(0.95); }
      100% { opacity: 0; transform: scale(1.55); }
    }

    .keycap:hover {
      background: #18181f;
      box-shadow: 0 0 14px var(--active-rgb);
    }

    .keycap.pill {
      aspect-ratio: 2.1 / 1;
      border-radius: 999px;
      font-size: clamp(0.42rem, 0.75vw, 0.68rem);
    }

    .keycap.pill::after {
      border-radius: 999px;
    }

    .keycap.w-half  { flex: 0.58; aspect-ratio: auto; }
    .keycap.w-tab   { flex: 1.48; aspect-ratio: auto; }
    .keycap.w-caps  { flex: 1.82; aspect-ratio: auto; }
    .keycap.w-shift { flex: 2.25; aspect-ratio: auto; }
    .keycap.w-ctrl  { flex: 0.9;  aspect-ratio: auto; }
    .keycap.w-space { flex: 5.2;  aspect-ratio: auto; }
    .keycap.w-fill  { flex: 1.5;  aspect-ratio: auto; }

    /* =====================================================================
       SUBTLE DIMMING + STRONG RGB NEON GLOW ON PRESSED OR INTRO-LIT KEY
       ===================================================================== */
    .keyboard-chassis.dim-mode .keycap:not(.active-key):not(.rgb-ripple) {
      opacity: 0.54;
    }

    .keycap.active-key,
    .keycap.intro-lit {
      opacity: 1 !important;
      background: rgba(255, 255, 255, 0.34);
      border-color: #ffffff !important;
      box-shadow:
        0 0 28px var(--active-rgb),
        0 0 14px #ffffff,
        inset 0 0 16px var(--active-rgb) !important;
      transform: translateY(-2px) scale(1.05);
      z-index: 3;
    }

    .keycap.active-key::after,
    .keycap.intro-lit::after {
      border-color: #ffffff;
      box-shadow: inset 0 0 10px var(--active-rgb);
    }

    .multi-dots {
      position: absolute;
      bottom: 11%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 2.5px;
    }

    .multi-dots span {
      width: 3.5px;
      height: 3.5px;
      border-radius: 50%;
      background: #ffffff;
    }

    .lbl-tl { position: absolute; top: 12%; left: 14%; font-size: 0.68em; line-height: 1; }
    .lbl-tr { position: absolute; top: 12%; right: 14%; font-size: 0.68em; line-height: 1; }
    .lbl-bl { position: absolute; bottom: 12%; left: 14%; font-size: 0.68em; line-height: 1; }
    .lbl-br { position: absolute; bottom: 12%; right: 14%; font-size: 0.68em; line-height: 1; }
    .lbl-c  { font-size: 1em; font-weight: 600; }
    .lbl-sm { font-size: 0.72em; }

    .numpad-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: clamp(4px, 0.55vw, 7px);
    }

    .numpad-grid .keycap {
      aspect-ratio: auto;
      width: 100%;
      height: 100%;
    }

    .split-arrows {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .split-arrows .keycap {
      aspect-ratio: auto;
      flex: 1;
      border-radius: 4px;
      font-size: 0.65em;
    }

    /* =====================================================================
       CLEAN MOBILE AZERTY KEYBOARD
       ===================================================================== */
    @media (max-width: 768px) {
      .stage-area {
        min-height: 195px;
      }

      .lowerthird-box {
        height: 174px;
        max-width: 96vw;
      }

      .lt-photo-wrap,
      .reel-card .lt-photo-wrap {
        width: 132px;
      }

      .reel-deck {
        height: 184px;
      }

      .reel-card {
        width: 90vw;
        height: 172px;
      }

      .lt-title {
        font-size: 1rem;
      }

      .lt-sub {
        font-size: 0.75rem;
      }

      .keyboard-chassis {
        padding: 10px 8px;
        border-radius: 22px;
        border-width: 2.5px;
      }

      .kb-main {
        gap: 6px;
      }

      .kb-row {
        gap: 4.5px;
      }

      .kb-numpad,
      .hide-mobile {
        display: none !important;
      }

      .mobile-only {
        display: flex !important;
      }

      .keycap {
        aspect-ratio: auto;
        height: 46px;
        font-size: 0.92rem;
        border-radius: 8px;
        border-width: 1.2px;
      }

      .keycap::after {
        inset: 1.5px;
        border-width: 1.1px;
        border-radius: 6px;
      }

      .lbl-tl {
        top: 4px;
        left: 4px;
        font-size: 0.54em;
        opacity: 0.88;
      }

      .lbl-br {
        bottom: 4px;
        right: 4px;
        font-size: 0.54em;
        opacity: 0.88;
      }

      .keycap.has-dots .lbl-c {
        transform: translateY(-2px);
      }

      .multi-dots {
        bottom: 5px;
        gap: 2px;
      }

      .multi-dots span {
        width: 3px;
        height: 3px;
      }
    }
  </style>
</head>
<body>

  <!-- Stage: 3D Intro Tiles, Single Lower-Third Box, and 3D ESC Coverflow Deck -->
  <div class="stage-area">
    <div class="intro-word-banner" id="introWordBanner"></div>

    <div class="lowerthird-box" id="lowerthirdBox">
      <div class="lt-photo-wrap">
        <div class="lt-slider-track" id="ltSliderTrack"></div>
        <div class="lt-slide-dots" id="ltSlideDots"></div>
      </div>
      <div class="lt-info">
        <div class="lt-top-row">
          <span class="lt-key-pill" id="ltKeyPill">A</span>
        </div>
        <div class="lt-text-group" id="ltTextGroup">
          <div class="lt-title" id="ltTitle">Anniversary</div>
          <div class="lt-sub" id="ltSub">Celebrating us and every milestone with my sayang.</div>
        </div>
      </div>
    </div>

    <!-- 3D Coverflow Deck for ESC Alphabetical Showcase -->
    <div class="reel-deck" id="reelDeck"></div>
  </div>

  <!-- Belgian AZERTY Keyboard -->
  <div class="kb-outer">
    <div class="keyboard-chassis rgb-ambient" id="kbChassis">

      <div class="kb-main">
        <!-- Row 1: Desktop Function Pill Keys -->
